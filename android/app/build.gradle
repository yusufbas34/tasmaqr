plugins {
    id "com.android.application"
}

// Uygulamanın arayüzü sitenin kendisidir: depo kökündeki index.html, gizlilik.html ve shared/ derlemede
// uygulamanın içine kopyalanır. Web ve uygulama böylece hep aynı sürümde kalır (index.html'deki APP modu).
def webAssets = layout.buildDirectory.dir("webassets")
def syncWebAssets = tasks.register("syncWebAssets", Sync) {
    from(rootProject.projectDir.parentFile) {
        include "index.html", "gizlilik.html", "shared/**"
    }
    into webAssets
}

android {
    namespace "io.github.yusufbas34.tasmaqr"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.yusufbas34.tasmaqr"
        minSdk 29
        targetSdk 36
        // GitHub Actions her derlemede sürümü artırır; yeni APK eskisinin üstüne kurulur
        def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
        versionCode run
        versionName "1.0.${run}"
    }

    sourceSets {
        main {
            assets.srcDirs = [webAssets.get().asFile]
        }
    }

    buildFeatures {
        buildConfig true
    }

    // İki dağıtım: "github" elden kurulan APK'dır ve yeni sürümü GitHub'dan kendisi haber verir.
    // "play" Google Play'e yüklenen AAB'dir; kendini güncellemez (Play kuralı), güncellemeyi Play Store yapar.
    flavorDimensions = ["dagitim"]
    productFlavors {
        github {
            dimension "dagitim"
        }
        play {
            dimension "dagitim"
        }
    }

    // Elden dağıtım (APK) için sabit imza: her sürüm öncekinin üstüne kurulabilsin. Google Play bunu kullanmaz.
    signingConfigs {
        sideload {
            storeFile file("tasmaqr-sideload.keystore")
            storeType "pkcs12"
            storePassword "tasmaqr-sideload"
            keyAlias "tasmaqr"
            keyPassword "tasmaqr-sideload"
        }
    }

    // Google Play yükleme anahtarı depoda DURMAZ: GitHub Actions onu Secrets'tan dosyaya yazar ve yolunu verir
    // (android/GOOGLE_PLAY.md). Anahtar yoksa play sürümü imzasız derlenir ve Play'e yüklenemez.
    def playKey = System.getenv("PLAY_KEYSTORE_FILE")
    if (playKey) {
        signingConfigs {
            play {
                storeFile file(playKey)
                storePassword System.getenv("PLAY_KEYSTORE_PASSWORD")
                keyAlias System.getenv("PLAY_KEY_ALIAS")
                keyPassword System.getenv("PLAY_KEY_PASSWORD")
            }
        }
    }
    productFlavors.github.signingConfig signingConfigs.sideload
    if (playKey) productFlavors.play.signingConfig signingConfigs.play

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named("preBuild") { dependsOn syncWebAssets }
