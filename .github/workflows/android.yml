name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "index.html", "gizlilik.html", "shared/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Google Play yükleme anahtarı (Settings > Secrets and variables > Actions). Yoksa yalnızca APK derlenir.
      PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle (elden kurulum sürümü)
        working-directory: android
        run: ./gradlew --no-daemon assembleGithubRelease

      - name: APK dosyasını hazırla
        run: cp android/app/build/outputs/apk/github/release/app-github-release.apk tasma-qr.apk

      # Google Play sürümü: kendini güncellemez. Gizli anahtar (Secrets) varsa imzalı, yoksa imzasız derlenir;
      # imzasız paket sonradan yükleme anahtarıyla jarsigner ile imzalanabilir (android/GOOGLE_PLAY.md).
      - name: Google Play paketi (AAB) derle
        working-directory: android
        env:
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          if [ -n "$PLAY_KEYSTORE_BASE64" ]; then
            echo "$PLAY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/play.jks"
            # Alias'ı anahtar dosyasından doğrula: Secrets'taki ad dosyada yoksa dosyadaki tek (ilk) anahtar kullanılır
            ALIASES=$(keytool -list -keystore "$RUNNER_TEMP/play.jks" -storepass "$PLAY_KEYSTORE_PASSWORD" 2>/dev/null | sed -n 's/^\([^,]*\),.*PrivateKeyEntry.*/\1/p')
            if [ -z "$ALIASES" ]; then
              echo "::error::Anahtar dosyası açılamadı: PLAY_KEYSTORE_PASSWORD yanlış ya da PLAY_KEYSTORE_BASE64 eksik kopyalanmış."; exit 1
            fi
            if ! printf '%s\n' "$ALIASES" | grep -qxF "$PLAY_KEY_ALIAS"; then
              FOUND=$(printf '%s\n' "$ALIASES" | head -n 1)
              echo "::warning::PLAY_KEY_ALIAS anahtar dosyasında yok; dosyadaki alias kullanılıyor: $FOUND (Secrets'taki PLAY_KEY_ALIAS'ı buna çevirebilirsiniz)"
              export PLAY_KEY_ALIAS="$FOUND"
            fi
            PLAY_KEYSTORE_FILE="$RUNNER_TEMP/play.jks" ./gradlew --no-daemon bundlePlayRelease
            rm -f "$RUNNER_TEMP/play.jks"
            cp app/build/outputs/bundle/playRelease/app-play-release.aab ../tasma-qr-play.aab
          else
            ./gradlew --no-daemon bundlePlayRelease
            cp app/build/outputs/bundle/playRelease/app-play-release.aab ../tasma-qr-play-imzasiz.aab
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tasma-qr-play-aab
          path: tasma-qr-play*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: tasma-qr-apk
          path: tasma-qr.apk

      # Sabit indirme bağlantısı: https://github.com/<sahip>/<repo>/releases/download/apk-son/tasma-qr.apk
      - name: Son sürüm bağlantısını güncelle
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-son --yes --cleanup-tag || true
          gh release create apk-son tasma-qr.apk \
            --title "Tasma QR Android uygulaması (son sürüm)" \
            --notes "Derleme ${{ github.run_number }} · ${{ github.sha }}. Telefona kurmak için tasma-qr.apk dosyasını indirip açın; ilk kurulumda 'bilinmeyen kaynaklara izin ver' istenir." \
            --target "${{ github.sha }}"

      # İmzalı Play paketi için sabit indirme bağlantısı (anahtar Secrets'ta varsa):
      # https://github.com/<sahip>/<repo>/releases/download/play-son/tasma-qr-play.aab
      - name: Play paketi bağlantısını güncelle
        if: github.ref == 'refs/heads/main' && env.PLAY_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete play-son --yes --cleanup-tag || true
          gh release create play-son tasma-qr-play.aab --prerelease \
            --title "Tasma QR Google Play paketi (son sürüm)" \
            --notes "Derleme ${{ github.run_number }} · ${{ github.sha }}. Play Console > Test > Kapalı test > Yeni sürüm oluştur'a bu .aab dosyasını yükleyin." \
            --target "${{ github.sha }}"
