    <pattern id="hatch" width="2" height="2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="2" stroke="#9a8a70" stroke-width="0.16"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="2.4" markerHeight="2.4" markerUnits="userSpaceOnUse" orient="auto-start-reverse">

<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const MM = 96 / 25.4, DPR = 3.2;
const NS = 'http://www.w3.org/2000/svg';
const G = document.getElementById('g');
function el(tag, attrs, parent = G) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
function txt(x, y, s, o = {}) { const t = el('text', { x, y, 'font-size': o.size || 2.6, 'text-anchor': o.anchor || 'middle', 'font-weight': o.weight || 400, ...(o.rot ? { transform: `rotate(${o.rot} ${x} ${y})` } : {}), ...(o.fill ? { fill: o.fill } : {}) }); t.textContent = s; return t; }
function line(x1, y1, x2, y2, w = 0.25, extra = {}) { return el('line', { x1, y1, x2, y2, stroke: '#111', 'stroke-width': w, ...extra }); }
function frame(x, y, w, h) { el('rect', { x, y, width: w, height: h, fill: 'none', stroke: '#111', 'stroke-width': 0.25 }); }

const loader = new STLLoader();
async function load(n) {
  const g = await loader.loadAsync(`./${n}.stl`);
  g.deleteAttribute('normal');
  const m = mergeVertices(g, 1e-3); m.computeVertexNormals(); return m;
}
const NAMES = ['kelepce', 'kartal', 'somun', 'vida', 'pabuc'];
const GEO = Object.fromEntries(await Promise.all(NAMES.map(async n => [n, await load(n)])));

const DESK = 25, BOLT_Y = 26, TAIL_Y = -61.6, TAIL_Z = 30.6, TOP = 115.7, WING = 63.4;
const ASM = { kelepce: [0, 0, 0], kartal: [0, 0, 0], somun: [0, BOLT_Y, -59.5], vida: [0, BOLT_Y, -90.5], pabuc: [0, BOLT_Y, -DESK - 7] };
const EXP = { kelepce: [0, 0, 0], kartal: [0, 0, 38], somun: [0, BOLT_Y, -36], vida: [0, BOLT_Y, -150], pabuc: [0, BOLT_Y, -16] };
const RCOL = { kelepce: 0x5e4630, kartal: 0x7a5b3e, somun: 0x2f3338, vida: 0x2f3338, pabuc: 0x1d1d1d };

function outlineMat(t) {
  return new THREE.ShaderMaterial({ side: THREE.BackSide, uniforms: { t: { value: t } },
    vertexShader: 'uniform float t; void main(){ gl_Position = projectionMatrix * modelViewMatrix * vec4(position + normal * t, 1.0); }',
    fragmentShader: 'void main(){ gl_FragColor = vec4(0.07,0.07,0.07,1.0); }' });
}
function addPart(scene, name, pos, { color = 0xe6e6e3, render = false, scale = 1 } = {}) {
  const geo = GEO[name];
  const mat = render ? new THREE.MeshStandardMaterial({ color, roughness: name === 'pabuc' ? 0.9 : 0.55 })
                     : new THREE.MeshLambertMaterial({ color, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
  const m = new THREE.Mesh(geo, mat); m.position.set(...pos); scene.add(m);
  if (!render) {
    const o = new THREE.Mesh(geo, outlineMat(0.3 / scale)); o.position.set(...pos); scene.add(o);
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 40), new THREE.LineBasicMaterial({ color: 0x111111 }));
    e.position.set(...pos); scene.add(e);
  }
}
function lights(scene, strong = false) {
  scene.add(new THREE.HemisphereLight(0xffffff, 0xb9b4aa, strong ? 1.6 : 2.1));
  const d = new THREE.DirectionalLight(0xffffff, strong ? 2.2 : 1.1); d.position.set(140, -220, 260); scene.add(d);
  const d2 = new THREE.DirectionalLight(0xffffff, strong ? 0.8 : 0.4); d2.position.set(-150, 250, 100); scene.add(d2);
}
function deskMesh() {
  const desk = new THREE.Mesh(new THREE.BoxGeometry(220, 140, DESK), new THREE.MeshStandardMaterial({ color: 0xd8c3a0, roughness: 0.8, transparent: true, opacity: 0.55 }));
  desk.position.set(0, 70, -DESK / 2); return desk;
}

function panel({ x, y, w, h, dir, up, center, scale = 1, build, persp = null, bg = null }) {
  const cv = document.createElement('canvas');
  Object.assign(cv.style, { left: x + 'mm', top: y + 'mm', width: w + 'mm', height: h + 'mm' });
  document.body.insertBefore(cv, document.getElementById('ov'));
  const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: !bg, preserveDrawingBuffer: true });
  r.setPixelRatio(DPR); r.setSize(w * MM, h * MM, false);
  if (bg) r.setClearColor(bg, 1);
  r.outputColorSpace = THREE.SRGBColorSpace;
  const scene = new THREE.Scene();
  const c = new THREE.Vector3(...center);
  let cam;
  if (persp) {
    cam = new THREE.PerspectiveCamera(persp.fov, w / h, 1, 5000);
    cam.position.set(...persp.pos); cam.up.set(0, 0, 1); cam.lookAt(c);
  } else {
    const hw = w / 2 / scale, hh = h / 2 / scale;
    cam = new THREE.OrthographicCamera(-hw, hw, hh, -hh, 1, 4000);
    cam.position.copy(c).addScaledVector(new THREE.Vector3(...dir).normalize(), -1000);
    cam.up.set(...up); cam.lookAt(c);
  }
  cam.updateMatrixWorld(); cam.updateProjectionMatrix();
  build(scene, scale);
  r.render(scene, cam);
  const P = (p) => { const v = new THREE.Vector3(...p).project(cam); return [x + (v.x + 1) / 2 * w, y + (1 - v.y) / 2 * h]; };
  return { P, x, y, w, h };
}

function dim(A, B, axis, at, text, o = {}) {
  const g = el('g', {});
  const gap = 0.8, over = 1.5, sw = 0.16;
  if (axis === 'v') {
    for (const p of [A, B]) { const s = Math.sign(at - p[0]) || 1; el('line', { x1: p[0] + s * gap, y1: p[1], x2: at + s * over, y2: p[1], stroke: '#111', 'stroke-width': sw }, g); }
    el('line', { x1: at, y1: A[1], x2: at, y2: B[1], stroke: '#111', 'stroke-width': sw, 'marker-start': 'url(#ar)', 'marker-end': 'url(#ar)' }, g);
    g.appendChild(txt(at - 0.9, (A[1] + B[1]) / 2 + (o.shift || 0), text, { rot: -90, size: o.size || 2.8 }));
  } else {
    for (const p of [A, B]) { const s = Math.sign(at - p[1]) || 1; el('line', { x1: p[0], y1: p[1] + s * gap, x2: p[0], y2: at + s * over, stroke: '#111', 'stroke-width': sw }, g); }
    el('line', { x1: A[0], y1: at, x2: B[0], y2: at, stroke: '#111', 'stroke-width': sw, 'marker-start': 'url(#ar)', 'marker-end': 'url(#ar)' }, g);
    g.appendChild(txt((A[0] + B[0]) / 2 + (o.shift || 0), at - 0.9, text, { size: o.size || 2.8 }));
  }
}
function centerLine(a, b) { line(a[0], a[1], b[0], b[1], 0.16, { 'stroke-dasharray': '6 1.2 1 1.2' }); }
function vtitle(x, y, s, sub) { txt(x, y, s, { size: 3.2, weight: 700, anchor: 'start' }); if (sub) txt(x, y + 3.8, sub, { size: 2.4, fill: '#444', anchor: 'start' }); }
function balloon(cx, cy, n, tx, ty) {
  line(cx, cy, tx, ty, 0.18); el('circle', { cx: tx, cy: ty, r: 0.7, fill: '#111' });
  el('circle', { cx, cy, r: 3.4, fill: '#fff', stroke: '#111', 'stroke-width': 0.3 }); txt(cx, cy + 1.2, n, { size: 3.4, weight: 700 });
}
const ALL = (scene, pos, scale, opt = {}) => { for (const n of NAMES) addPart(scene, n, pos[n], { scale, ...(opt[n] || opt.all || {}) }); };
const RENDER = Object.fromEntries(NAMES.map(n => [n, { color: RCOL[n], render: true }]));

// ---------- 1: yan görünüş (profil), 1:2 ----------
const S = 0.5;
const V1 = panel({ x: 22, y: 14, w: 104, h: 124, scale: S, dir: [-1, 0, 0], up: [0, 0, 1], center: [0, -6, 10], build: (s, sc) => { lights(s); ALL(s, ASM, sc); } });
{
  const P = V1.P;
  const a = P([0, 0, 0]), b = P([0, 82, -DESK]);
  el('rect', { x: a[0], y: a[1], width: b[0] - a[0], height: b[1] - a[1], fill: 'url(#hatch)', stroke: '#7a6a50', 'stroke-width': 0.2, 'stroke-dasharray': '3 0.8 0.8 0.8' });
  txt((a[0] + b[0]) / 2 + 6, (a[1] + b[1]) / 2 + 1, 'MASA', { size: 2.2, fill: '#6a5a40', weight: 600 });
  centerLine(P([0, BOLT_Y, -96]), P([0, BOLT_Y, -14]));
  dim(P([0, -10, TOP]), P([0, -10, -66]), 'v', P([0, -82, 0])[0], '182');
  dim(P([0, 30, TOP]), P([0, 30, 0]), 'v', P([0, 70, 0])[0], '116');
  dim(P([0, 0, 0]), P([0, 0, -50]), 'v', P([0, 9, 0])[0], '50', { size: 2.4 });
  dim(P([0, 42, -50]), P([0, 42, -66]), 'v', P([0, 56, 0])[0], '16', { size: 2.4 });
  dim(P([0, TAIL_Y, TAIL_Z]), P([0, TAIL_Y, 0]), 'v', P([0, -70, 0])[0], '31', { size: 2.4 });
  dim(P([0, TAIL_Y, 4]), P([0, 0, 4]), 'h', P([0, 0, -8])[1], '62', { size: 2.4 });
  dim(P([0, TAIL_Y, -66]), P([0, 50, -66]), 'h', P([0, 0, -112])[1], '112');
  dim(P([0, 0, -66]), P([0, BOLT_Y, -66]), 'h', P([0, 0, -100])[1], '26', { size: 2.4 });
  txt(P([0, -36, 0])[0], P([0, 0, -22])[1], 'kuyruk = askı', { size: 2.2, fill: '#444' });
  vtitle(V1.x + 2, V1.y + 4, 'YAN GÖRÜNÜŞ', 'montajlı · masa 25 mm · 1:2');
}

// ---------- 2: arkadan görünüş (birinci açı → sağa) ----------
const V2 = panel({ x: 128, y: 14, w: 108, h: 124, scale: S, dir: [0, 1, 0], up: [0, 0, 1], center: [0, 0, 20], build: (s, sc) => { lights(s); ALL(s, ASM, sc); } });
{
  const P = V2.P;
  dim(P([-WING, 0, 100]), P([WING, 0, 100]), 'h', P([0, 0, 123])[1], '127');
  dim(P([-22, 0, -66]), P([22, 0, -66]), 'h', P([0, 0, -102])[1], '44', { size: 2.4 });
  centerLine(P([0, 0, 120]), P([0, 0, -98]));
  vtitle(V2.x + 2, V2.y + 4, 'ARKADAN GÖRÜNÜŞ · 1:2');
}

// ---------- 3: üstten (birinci açı → alta) ----------
const V3 = panel({ x: 22, y: 140, w: 104, h: 76, scale: S, dir: [0, 0, -1], up: [-1, 0, 0], center: [0, -6, 0], build: (s, sc) => { lights(s); ALL(s, ASM, sc); } });
{
  const P = V3.P;
  dim(P([WING, 40, 0]), P([-WING, 40, 0]), 'v', P([0, 66, 0])[0], '127');
  dim(P([22, TAIL_Y, 0]), P([-22, TAIL_Y, 0]), 'v', P([0, -72, 0])[0], '44', { size: 2.4 });
  centerLine(P([-30, BOLT_Y, 0]), P([30, BOLT_Y, 0]));
  vtitle(V3.x + 2, V3.y + 4, 'ÜST GÖRÜNÜŞ', '1:2');
}

// ---------- 4: masa tarafından (render) ----------
const V4 = panel({ x: 128, y: 140, w: 108, h: 76, center: [0, 10, 45], persp: { fov: 26, pos: [130, 430, 160] }, bg: 0xf4f2ee,
  build: s => { lights(s, true); ALL(s, ASM, 1, RENDER); s.add(deskMesh()); } });
frame(V4.x, V4.y, V4.w, V4.h);
vtitle(V4.x + 3, V4.y + 5, 'MASA TARAFINDAN', 'kartal masaya bakar');

// ---------- İzometrik ----------
const V5 = panel({ x: 242, y: 12, w: 168, h: 104, center: [0, 0, 22], persp: { fov: 28, pos: [-300, -360, 190] }, bg: 0xf4f2ee,
  build: s => { lights(s, true); ALL(s, ASM, 1, RENDER); s.add(deskMesh()); } });
frame(V5.x, V5.y, V5.w, V5.h);
vtitle(V5.x + 4, V5.y + 6, 'İZOMETRİK GÖRÜNÜŞ', 'masaya takılı, ölçeksiz');

// ---------- Patlatılmış montaj ----------
const V6 = panel({ x: 242, y: 118, w: 84, h: 112, center: [0, 0, 4], scale: 0.3, dir: [-1.3, -0.45, -0.55], up: [0, 0, 1],
  build: (s, sc) => { lights(s); ALL(s, EXP, sc, { kelepce: { color: 0xe6e6e3 }, kartal: { color: 0xeeeeec }, vida: { color: 0xc9cdd2 }, somun: { color: 0xc9cdd2 }, pabuc: { color: 0x9a9a9a } }); } });
{
  const P = V6.P;
  centerLine(P([0, BOLT_Y, -156]), P([0, BOLT_Y, 4]));
  for (const [px, py] of [[-9, 17], [9, 17]]) centerLine(P([px, py, 9]), P([px, py, 60]));
  const q = (n, p, bx, by) => { const t = P(p); balloon(bx, by, n, t[0], t[1]); };
  q('1', [0, -45, 14], V6.x + 10, V6.y + 62);
  q('2', [-40, 4, 108], V6.x + 10, V6.y + 22);
  q('3', [12, BOLT_Y, -31], V6.x + 74, V6.y + 70);
  q('4', [0, BOLT_Y + 15, -145], V6.x + 74, V6.y + 102);
  q('5', [14, BOLT_Y, -12], V6.x + 74, V6.y + 58);
  vtitle(V6.x + 4, V6.y + 6, 'PATLATILMIŞ MONTAJ', '1:3,3');
}
frame(V6.x, V6.y, V6.w, V6.h);

// ---------- Detay: vida, somun, pabuç (1:1) ----------
const V7 = panel({ x: 328, y: 128, w: 46, h: 102, center: [0, 0, 31], dir: [-1, 0, 0], up: [0, 0, 1], build: (s, sc) => { lights(s); addPart(s, 'vida', [0, 0, 0], { color: 0xdfe2e6, scale: sc }); } });
{
  const P = V7.P;
  centerLine(P([0, 0, -4]), P([0, 0, 66]));
  dim(P([0, -8, 58]), P([0, 8, 58]), 'h', P([0, 0, 68])[1], 'Ø16 × 3', { size: 2.6 });
  dim(P([0, 8, 14]), P([0, 8, 62]), 'v', P([0, 17, 0])[0], '48', { size: 2.6 });
  dim(P([0, -20.7, 0]), P([0, 20.7, 0]), 'h', P([0, 0, -6])[1], 'Ø42', { size: 2.6 });
  dim(P([0, -20.7, 0]), P([0, -20.7, 14]), 'v', P([0, -23, 0])[0], '14', { size: 2.4 });
}
const V8 = panel({ x: 374, y: 128, w: 36, h: 52, center: [0, 0, 5], dir: [0, 0, -1], up: [0, 1, 0], build: (s, sc) => { lights(s); addPart(s, 'somun', [0, 0, 0], { color: 0xdfe2e6, scale: sc }); } });
{
  const P = V8.P;
  dim(P([-7.5, 13, 10]), P([-7.5, -13, 10]), 'v', P([-17, 0, 0])[0], 'AA 26', { size: 2.4 });
  dim(P([-15, -13, 10]), P([15, -13, 10]), 'h', P([0, -19, 0])[1], '30', { size: 2.4 });
  txt(V8.x + V8.w / 2, V8.y + V8.h - 2, 'somun · kalınlık 10', { size: 2.2, fill: '#444' });
}
const V9 = panel({ x: 374, y: 182, w: 36, h: 48, center: [0, 0, 3.5], dir: [1, 0.8, -0.9], scale: 0.9, up: [0, 0, 1], build: (s, sc) => { lights(s); addPart(s, 'pabuc', [0, 0, 0], { color: 0xb5b5b5, scale: sc }); } });
txt(V9.x + V9.w / 2, V9.y + V9.h - 4, 'pabuç Ø30 × 7', { size: 2.2, fill: '#444' });
frame(328, 118, 82, 112);
vtitle(332, 124, 'DETAY · PARÇA 3, 4, 5', '1:1');

// ---------- Notlar + montaj ----------
{
  let x = 24, y = 224;
  txt(x, y, 'NOTLAR', { size: 3.0, weight: 700, anchor: 'start' });
  ['Ölçüler mm. Genel tolerans ±0,3 (FDM).',
   'Masaya delik açılmaz; vida elle sıkılır.',
   'Masa kalınlığı 15–45 mm.',
   'Diş: tek ağız, Ø16, adım 3, derinlik 1,2.',
   'Somun iç dişi +0,45 mm boşluklu.',
   'Pimler Ø6 × 5, kartaldaki delik Ø6,5.',
   'Kuyruk kalınlığı 8,5; kelepçeyle tek parça.',
   'Kuyruk yükü: en çok 3 kg (hesap: kökte',
   '≈4 MPa). Basıldıktan sonra kademeli deneyin.',
   'Pabuç (5) TPU önerilir, masayı çizmez.'].forEach((s, i) => txt(x, y + 4.6 + i * 3.4, s, { size: 2.25, anchor: 'start' }));
  x = 128;
  txt(x, y, 'MONTAJ', { size: 3.0, weight: 700, anchor: 'start' });
  ['1. Kartalı (2) kelepçenin (1) pimlerine oturtun,',
   '    CA veya epoksi ile yapıştırın.',
   '2. Somunu (3) çenedeki altıgen yuvaya bastırın.',
   '3. Vidayı (4) alttan çeneye geçirip somuna çevirin.',
   '4. Pabucu (5) vida ucuna oturtun.',
   '5. Kelepçeyi masa kenarına geçirin, topuzu sıkın.',
   '    Kartal masaya bakar, kuyruk dışarı uzanır.'].forEach((s, i) => txt(x, y + 4.6 + i * 3.4, s, { size: 2.25, anchor: 'start' }));
}

// ---------- Parça listesi ----------
{
  const x = 242, y = 232, w = 168;
  const cols = [0, 9, 60, 71, 100, 146, 168];
  const head = ['Poz', 'Parça', 'Adet', 'Malzeme', 'Baskı', 'Hacim'];
  const rows = [
    ['1', 'Kelepçe + kuyruk askı', '1', 'PETG', 'yan yatık, 5 duvar, %40', '89 cm³'],
    ['2', 'Kartal, açık kanat, taş kaide', '1', 'PETG / PLA', 'dik, ağaç destek, %15', '56 cm³'],
    ['3', 'Somun Ø16×3, AA 26', '1', 'PETG', 'düz, %100', '3,9 cm³'],
    ['4', 'Sıkma vidası Ø16×3 × 48', '1', 'PETG', 'topuz altta, %100', '26 cm³'],
    ['5', 'Pabuç Ø30 × 7', '1', 'TPU / PETG', 'düz, %100', '4,2 cm³'],
  ];
  const rh = 4.2, n = rows.length + 1;
  el('rect', { x, y, width: w, height: rh * n, fill: 'none', stroke: '#111', 'stroke-width': 0.35 });
  el('rect', { x, y, width: w, height: rh, fill: '#ececea', stroke: 'none' });
  for (let i = 1; i < n; i++) line(x, y + rh * i, x + w, y + rh * i, i === 1 ? 0.3 : 0.15);
  for (let j = 1; j < cols.length - 1; j++) line(x + cols[j], y, x + cols[j], y + rh * n, 0.15);
  [head, ...rows].forEach((r, i) => r.forEach((s, j) => txt(x + cols[j] + 1.4, y + rh * i + 3.0, s, { size: 2.3, anchor: 'start', weight: i ? 400 : 700 })));
}

// ---------- Antet ----------
{
  const x = 242, y = 259, w = 168, h = 28;
  el('rect', { x, y, width: w, height: h, fill: 'none', stroke: '#111', 'stroke-width': 0.5 });
  line(x, y + 11, x + w, y + 11, 0.3); line(x + 100, y, x + 100, y + h, 0.3);
  line(x, y + 19.5, x + w, y + 19.5, 0.2); line(x + 134, y + 11, x + 134, y + h, 0.2);
  line(x + 34, y + 11, x + 34, y + h, 0.2); line(x + 67, y + 11, x + 67, y + h, 0.2);
  txt(x + 3, y + 5.6, 'KARTAL ASKI', { size: 4.8, weight: 800, anchor: 'start' });
  txt(x + 3, y + 9.4, 'masa kelepçeli kulaklık / çanta askısı · montaj ve ölçü resmi', { size: 2.3, anchor: 'start', fill: '#333' });
  const cell = (cx, cy, k, v) => { txt(cx, cy, k, { size: 1.8, anchor: 'start', fill: '#666' }); txt(cx, cy + 3.9, v, { size: 2.7, anchor: 'start', weight: 600 }); };
  cell(x + 2, y + 13.5, 'ÖLÇEK', '1:2 · A3');
  cell(x + 36, y + 13.5, 'BİRİM', 'mm');
  cell(x + 69, y + 13.5, 'TARİH', '03.11.2026');
  cell(x + 2, y + 22, 'ÇİZEN', 'Tasma QR Üretim');
  cell(x + 36, y + 22, 'MALZEME', 'PETG / TPU');
  cell(x + 69, y + 22, 'AĞIRLIK', '≈ 140 g');
  cell(x + 102, y + 3, 'PAFTA NO', 'TQ-KA-001');
