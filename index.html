<style>
:root{--ink:#111418;--band:#b8501a;--band2:#163a7a;--line:#d6cfc7;--muted:#5d5650;
  --ok:#0c7a43;--err:#b3261e;--bg:#f6f1ea}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);
  min-height:100vh;padding:max(28px,env(safe-area-inset-top)) 18px 40px}
main{max-width:440px;margin:0 auto}
main.wide{max-width:1100px}
main.home{max-width:780px}
main.mid{max-width:640px}
.pet{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 18px 6px 6px;margin-bottom:22px}
.pet .ic{width:46px;height:46px;border-radius:50%;background:var(--band);display:flex;align-items:center;justify-content:center;flex:none}
.pet .ic svg{width:28px;height:28px}
.pet.is-lost .ic{background:var(--err)}
.pet .nm{flex:1;font-family:"Barlow Condensed","Barlow",sans-serif;font-weight:700;font-size:28px;letter-spacing:.04em;line-height:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pet small{font-size:13px;color:var(--muted);letter-spacing:.08em}
h1{font-size:25px;line-height:1.2;margin:0 0 8px}
h2{font-size:21px;margin:26px 0 10px}
p{font-size:16px;line-height:1.5;margin:0 0 16px;color:var(--muted)}
label{display:block;font-weight:600;font-size:15px;margin:18px 0 6px}
.opt{font-weight:400;color:var(--muted)}
input,select.big{width:100%;font:inherit;font-size:19px;padding:13px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);resize:vertical}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--band)}
.hint{display:block;font-size:14px;color:var(--muted);margin-top:6px;line-height:1.45}
/* ana sayfa */
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;margin-bottom:34px}
.hero h1{font-size:34px;line-height:1.1;margin-bottom:12px}
.hero .lead{font-size:18px}
.hero .cta{display:inline-block;width:auto;padding:14px 22px;margin:6px 8px 0 0}
.btn.alt{background:var(--band2)}
.showcase{display:flex;flex-direction:column;align-items:center;gap:10px}
.showcase .pair{display:flex;gap:14px;align-items:center}
.showcase button,.chip{font:inherit;font-size:14px;font-weight:600;color:var(--band);background:#fff;border:2px solid var(--line);
  border-radius:999px;padding:6px 14px;cursor:pointer}
.note{background:#fff;border-left:4px solid var(--band);border-radius:6px;padding:12px 14px;font-size:15px;color:var(--ink);margin-bottom:30px}
section{margin-bottom:38px}
section > h2{font-size:24px;margin:0 0 14px}
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;counter-reset:s}
.steps li{background:#fff;border-radius:10px;padding:16px 14px;counter-increment:s;font-size:15px;line-height:1.45;color:var(--muted)}
.steps li::before{content:counter(s);display:flex;width:32px;height:32px;border-radius:50%;background:var(--band);color:#fff;
  font-weight:700;align-items:center;justify-content:center;margin-bottom:8px}
.steps b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.perks div{background:#fff;border-radius:10px;padding:14px;font-size:15px;line-height:1.45;color:var(--muted)}
.perks b{display:block;color:var(--ink);margin-bottom:2px}
details{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:8px}
summary{font-weight:700;cursor:pointer}
details p{margin:8px 0 0}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px}
.card > h2:first-child{margin-top:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:15px;line-height:1.45;color:var(--muted)}
.check input{width:20px;height:20px;flex:none;margin-top:2px}
.lostcheck{background:#fbe9e8;color:var(--err);border-radius:8px;padding:12px;font-weight:600}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (max-width:640px){.hero{grid-template-columns:1fr}.hero h1{font-size:28px}.row2{grid-template-columns:1fr}}
/* tasmaya asılı rozet */
.collar{position:relative;width:300px;height:300px;flex:none}
.collar .strap{position:absolute;left:0;top:0;width:300px;height:120px}
.collar .hang{position:absolute;left:50%;top:73px;transform-origin:50% 21px;animation:swing 3.2s ease-in-out infinite}
.collar .hang .badgebox{zoom:1.2;filter:drop-shadow(0 6px 10px #0004)}
@keyframes swing{0%,100%{transform:translateX(-50%) rotate(7deg)}50%{transform:translateX(-50%) rotate(-7deg)}}
/* ilk giriş tanıtımı (reels) */
body.intro-open{overflow:hidden}
.intro{position:fixed;inset:0;z-index:40;background:#0f1115;color:#fff}
.intro-reels{height:100vh;height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.intro-reels::-webkit-scrollbar{display:none}
.intro-slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;justify-content:center;gap:26px;
  padding:max(56px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom))}
.intro-artbox{display:flex;justify-content:center;min-height:0}
.intro-art{width:100%;max-width:400px;height:auto;max-height:46vh;border-radius:22px;box-shadow:0 20px 60px #0007}
.intro-collar{display:flex;justify-content:center;align-items:center;background:#f6f1ea;aspect-ratio:1/1;overflow:hidden}
.intro-collar .collar{zoom:.82}
.intro-copy{max-width:460px;margin:0 auto;text-align:center}
.intro-copy h1{font-size:28px;line-height:1.15;margin:0 0 10px;color:#fff}
.intro-copy p{color:#ffffffcc;font-size:17px;margin:0}
.intro-copy .btn{margin-top:18px;background:#fff;color:var(--band);font-size:19px}
.intro-copy .intro-later{margin-top:10px;background:transparent;color:#fff;border:2px solid #ffffff66;font-size:16px;padding:12px}
.intro-next{margin-top:18px;font:inherit;font-size:15px;font-weight:600;color:#ffffffaa;background:none;border:0;cursor:pointer;animation:nudgeUp 1.6s ease-in-out infinite}
@keyframes nudgeUp{50%{transform:translateY(-6px)}}
.intro-skip{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;z-index:2;font:inherit;font-size:16px;font-weight:700;
  color:#fff;background:#0006;border:1px solid #ffffff55;border-radius:999px;padding:8px 18px;cursor:pointer}
.intro-dots{position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:2;display:flex;flex-direction:column;gap:8px}
.intro-dots span{width:7px;height:7px;border-radius:50%;background:#ffffff55;transition:height .2s}
.intro-dots span.on{height:22px;border-radius:4px;background:#fff}
.intro-fan{position:relative;width:100%;max-width:400px;height:280px;margin:0 auto}
.intro-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.intro-card .badgebox{zoom:1.15;filter:drop-shadow(0 12px 24px #0009)}
.play .intro-card.c0{transform:translate(-112%,-44%) rotate(-12deg) scale(.88)}
.play .intro-card.c1{transform:translate(-50%,-54%) scale(1.04);z-index:1}
.play .intro-card.c2{transform:translate(12%,-44%) rotate(12deg) scale(.88)}
.play .intro-run{animation:introRun 1.4s cubic-bezier(.3,.7,.4,1) both}
@keyframes introRun{from{transform:translateX(-120px)}}
.play .intro-pop{animation:introPop .5s 1s both;transform-box:fill-box;transform-origin:20% 100%}
@keyframes introPop{from{transform:scale(0);opacity:0}}
.play .intro-blink{animation:introBlink 1s 1.3s 3 both}
@keyframes introBlink{50%{opacity:.25}}
.play .intro-collar .hang{animation:introHang 1.1s cubic-bezier(.3,1.4,.5,1) both,swing 3.2s 1.1s ease-in-out infinite}
@keyframes introHang{from{transform:translateX(-50%) translateY(-160px) rotate(25deg);opacity:0}}
.intro-scan{animation:introScan 1.6s ease-in-out infinite}
@keyframes introScan{0%,100%{transform:translateY(-34px)}50%{transform:translateY(34px)}}
.play .intro-nudge{animation:introNudge 1.2s ease-in-out infinite}
@keyframes introNudge{50%{transform:translateX(6px)}}
.intro-ring{transform-box:fill-box;transform-origin:center;animation:introRing 1.4s ease-in-out infinite}
@keyframes introRing{0%,40%,100%{transform:rotate(0)}10%,30%{transform:rotate(-6deg)}20%{transform:rotate(6deg)}}
.play .intro-drop{animation:introDrop .7s .5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes introDrop{from{transform:translateY(-120px);opacity:0}}
.intro-wave{transform-box:fill-box;transform-origin:center;animation:introWave 1.4s ease-out infinite}
@keyframes introWave{from{transform:scale(1);opacity:.9}to{transform:scale(3);opacity:0}}
@media (prefers-reduced-motion:reduce){.intro *,.collar .hang{animation:none!important;transition:none!important}.collar .hang{transform:translateX(-50%)}}
@media (min-height:760px){.intro-copy h1{font-size:31px}}
/* site üst menüsü, alt bölüm; uygulama üst barı ve alt sekmeleri */
body.has-top{padding-top:0}
.site-top{position:sticky;top:0;z-index:15;margin:0 -18px 26px;background:#fffdfa;border-bottom:1px solid var(--line);
  padding:env(safe-area-inset-top) 18px 0;box-shadow:0 2px 14px #0000000a}
.site-top .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:18px;min-height:62px}
.brand{display:flex;align-items:center;gap:9px;font-family:"Barlow Condensed","Barlow",sans-serif;font-weight:700;font-size:24px;color:var(--ink);text-decoration:none;flex:none}
.brand img{width:34px;height:34px}
.site-nav{display:flex;gap:2px;flex:1;min-width:0}
.site-nav a{font-weight:600;font-size:15.5px;color:var(--muted);text-decoration:none;padding:8px 11px;border-radius:8px;white-space:nowrap}
.site-nav a:hover{color:var(--ink);background:#f3ece4}
.site-nav a.on{color:var(--band);background:#fbeee5}
.site-top .cta{flex:none;font-weight:700;font-size:15.5px;color:#fff;background:var(--band);text-decoration:none;padding:10px 16px;border-radius:9px;white-space:nowrap}
@media (max-width:860px){
  .site-top .in{flex-wrap:wrap;gap:0 12px;min-height:0;padding-top:10px}
  .brand{flex:1}
  .site-nav{order:3;flex-basis:100%;overflow-x:auto;scrollbar-width:none;margin:6px -18px 0;padding:0 12px 8px}
  .site-nav::-webkit-scrollbar{display:none}
  .site-top .cta{padding:8px 12px;font-size:15px}
}
.site-foot{margin:56px -18px -40px;background:#201a16;color:#e9e1d8;padding:34px 18px max(30px,env(safe-area-inset-bottom))}
.site-foot .in{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:26px}
.site-foot .brand{color:#fff;display:flex;font-size:24px;padding:0}
.site-foot p{color:#bfb5aa;font-size:15px;margin:10px 0 0}
.site-foot h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#bfb5aa;margin:4px 0 10px}
.site-foot a{display:block;color:#fff;text-decoration:none;font-size:15px;padding:4px 0}
.site-foot .copy{grid-column:1/-1;border-top:1px solid #ffffff22;padding-top:14px;font-size:13px;color:#9d9389}
@media (max-width:700px){.site-foot .in{grid-template-columns:1fr 1fr}.site-foot .in > div:first-child{grid-column:1/-1}}
body.app-shell{padding-top:0}
body.has-tabbar{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.appbar{position:sticky;top:0;z-index:15;margin:0 -18px 18px;background:var(--band);color:#fff;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;min-height:58px;box-shadow:0 2px 12px #0002}
.appbar img{width:30px;height:30px;background:#fff;border-radius:50%;padding:2px}
.appbar span{font-family:"Barlow Condensed","Barlow",sans-serif;font-weight:700;font-size:23px;letter-spacing:.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appbar button{font:inherit;font-size:24px;line-height:1;color:#fff;background:#ffffff22;border:0;border-radius:50%;width:40px;height:40px;cursor:pointer;flex:none}
.app-shell .back{display:none}
.app-shell .hero-band{margin-top:-18px}
.tabbar a{font-size:11.5px;letter-spacing:-.01em;white-space:nowrap}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;background:#fff;border-top:1px solid var(--line);
  padding:6px 6px max(6px,env(safe-area-inset-bottom));box-shadow:0 -4px 16px #0000000d}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:700;color:var(--muted);text-decoration:none;padding:6px 0;border-radius:10px}
.tabbar a span:first-child{font-size:22px;line-height:1.1;filter:grayscale(1);opacity:.7}
.tabbar a.on{color:var(--band);background:#fbeee5}
.tabbar a.on span:first-child{filter:none;opacity:1}
/* ana sayfa ve tanıtım sayfaları */
.eyebrow{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--band);background:#fbeee5;border-radius:999px;padding:5px 12px;margin-bottom:14px}
.trust{display:flex;flex-wrap:wrap;gap:6px 16px;list-style:none;padding:0;margin:18px 0 0;font-size:14.5px;font-weight:600;color:var(--ink)}
.trust li::before{content:"✓";color:var(--ok);font-weight:800;margin-right:6px}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.feature{background:#fff;border-radius:14px;padding:20px;box-shadow:0 1px 2px #0000000d,0 6px 20px #0000000a}
.feature .ic{width:46px;height:46px;border-radius:12px;background:#fbeee5;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:12px}
.feature b{display:block;font-size:18px;margin-bottom:6px;color:var(--ink)}
.feature p{font-size:15px;margin:0}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{margin:0;font-size:26px}
.sec-head a{font-weight:700;color:var(--band);text-decoration:none;white-space:nowrap}
.page-head{margin-bottom:24px}
.page-head h1{font-size:34px;line-height:1.12;margin-bottom:10px}
.page-head p{font-size:18px;max-width:680px}
.cta-band{background:linear-gradient(135deg,#b8501a,#8e3a10);color:#fff;border-radius:18px;padding:28px 24px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta-band h2{color:#fff;margin:0 0 6px;font-size:26px}.cta-band p{color:#ffffffd9;margin:0}
.cta-band .btn{width:auto;display:inline-block;background:#fff;color:var(--band);margin:0;padding:14px 22px}
.finder-note{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:14px 16px;font-size:15px;color:var(--muted)}
.finder-note b{color:var(--ink)}
.locked{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#f7f3ee;border-radius:10px;padding:10px 12px;font-size:15px}
.locked i{width:22px;height:22px;border-radius:50%;border:1px solid #0003;flex:none}
.locked a{color:var(--band);font-weight:700}
.settings{display:grid;gap:10px}
.settings a,.settings button{display:flex;align-items:center;gap:12px;width:100%;font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:#fff;
  border:0;border-radius:12px;padding:14px 16px;text-decoration:none;cursor:pointer;text-align:left}
.settings a::after,.settings button::after{content:"›";margin-left:auto;color:var(--muted);font-size:22px}
.settings .danger{color:var(--err)}
.ig-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:14px;border-radius:12px;color:#fff;font-weight:700;font-size:17px;text-decoration:none;
  background:linear-gradient(45deg,#f9a72b,#e1306c 50%,#833ab4);box-shadow:0 6px 18px #e1306c40}
.ig-btn small{font-weight:600;opacity:.9}
.ig-band{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-radius:18px;padding:20px 22px;color:#fff;
  background:linear-gradient(110deg,#f9a72b,#e1306c 45%,#833ab4);box-shadow:0 12px 30px #e1306c33}
.ig-band > div{display:flex;gap:14px;align-items:center}
.ig-band svg{width:40px;height:40px;flex:none}
.ig-band b{display:block;font-family:"Barlow Condensed","Barlow",sans-serif;font-size:26px}
.ig-band span{color:#ffffffe6}
.ig-band .btn{width:auto;display:inline-block;margin:0;background:#fff;color:#c1305f;box-shadow:none;padding:12px 22px}
/* fiziksel rozet ürünleri */
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:4px}
.product{display:flex;gap:14px;align-items:center;text-align:left;font:inherit;color:inherit;background:#fff;border:2px solid var(--line);
  border-radius:12px;padding:14px;cursor:pointer}
button.product.on{border-color:var(--band);box-shadow:0 0 0 2px var(--band)}
.product .badgebox{zoom:1.5}
.product b{display:block;font-size:17px}
.product span{display:block;font-size:14px;line-height:1.45;color:var(--muted);margin-top:2px}
.product .price{color:var(--band);font-weight:700;font-size:16px;margin-top:6px}
.specs{margin:10px 0 0;padding-left:20px;font-size:15px;line-height:1.6;color:var(--muted)}
/* bulan kişi ekranı */
.lost{background:var(--err);color:#fff;border-radius:12px;padding:16px;margin-bottom:20px;font-size:16px;line-height:1.45}
.lost b{display:block;font-size:22px;letter-spacing:.02em;margin-bottom:4px}
.lost .reward{display:block;margin-top:8px;background:#fff;color:var(--err);border-radius:8px;padding:8px 10px;font-weight:700}
/* rozet oluşturma ve rozetlerim */
.designs{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.designs button{display:flex;align-items:center;gap:6px;font:inherit;font-size:14px;font-weight:600;padding:6px 12px 6px 6px;border-radius:999px;
  border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.designs button i{width:20px;height:20px;border-radius:50%;border:1px solid #0003}
.designs button.on{border-color:var(--band);box-shadow:0 0 0 2px var(--band)}
.preview{display:flex;justify-content:center;gap:16px;align-items:center;background:#fff;border-radius:12px;padding:18px;margin-bottom:6px}
.preview .grid{zoom:1.6}
@media (max-width:480px){.preview{flex-wrap:wrap;gap:10px;padding:14px}.preview .grid{zoom:1.15}}
.cards{display:grid;gap:10px}
.mine{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:#fff;border-radius:12px;padding:12px 14px;color:inherit;text-decoration:none;border-left:5px solid var(--line)}
.mine.is-lost{border-left-color:var(--err)}
.mine b{font-size:19px}
.mine span{display:block;font-size:14px;color:var(--muted);line-height:1.5}
.tagchip{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:2px 9px;background:#e6f4ec;color:var(--ok);margin-right:4px}
.tagchip.red{background:#fbe9e8;color:var(--err)}
.pinbox{font-size:30px;font-weight:700;letter-spacing:.2em;text-align:center;background:#fff7d6;border:2px dashed #e0a100;border-radius:10px;padding:10px;margin:6px 0 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;line-height:1.5}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-all}

  <a href="#urunler" data-tab="shop"><span aria-hidden="true">🏷️</span><span>Rozetler</span></a>
  <a href="#siparislerim" data-tab="orders"><span aria-hidden="true">📦</span><span>Siparişler</span></a>

<script>
const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
const BASE = location.origin + location.pathname;
// Yerelde denerken de basılan QR'lar gerçek siteyi açsın
const SITE = /^https?:$/.test(location.protocol) && !/^(localhost|127\.|0\.0\.0\.0|\[::1\])/.test(location.hostname) ? BASE : SITE_URL;
const tagLink = code => `${SITE}?k=${encodeURIComponent(code)}`;
// Android uygulaması (android/): aynı arayüz, MainActivity'nin AndroidBridge'i ile yazdırma, PDF ve bildirimler
const NATIVE = window.AndroidBridge, APP = !!NATIVE;
const editLink = code => APP ? `#duzenle/${encodeURIComponent(code)}` : `${tagLink(code)}&duzenle`;
const tagPageLink = code => `${APP ? "" : BASE}#kunye/${encodeURIComponent(code)}`;

// ---------------------------------------------------------------- yardımcılar
async function rpc(fn, args = {}) {
  const headers = {"Content-Type": "application/json", apikey: SUPABASE_KEY};
  if (SUPABASE_KEY.startsWith("eyJ")) headers.Authorization = "Bearer " + SUPABASE_KEY; // eski tip anon key
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {method: "POST", headers, body: JSON.stringify(args)});
  const data = await r.json().catch(() => null);
  if (!r.ok) { const e = new Error(data?.message || r.statusText); e.status = r.status; throw e; }
  return data;
}

function normalizePhone(raw) {
  let s = String(raw || "").replace(/[^\d+]/g, "");
  if (s.startsWith("00")) s = "+" + s.slice(2);
  if (s.startsWith("+")) return (s.length - 1 >= 10 && s.length - 1 <= 15) ? s : null;
  if (s.startsWith("90") && s.length === 12) return "+" + s;
  if (s.startsWith("0") && s.length === 11) return "+9" + s;
  if (s.startsWith("5") && s.length === 10) return "+90" + s;
  return null;
}

function prettyPhone(p) {
  if (p && p.startsWith("+90") && p.length === 13) {
    const n = p.slice(3);
    return `0${n.slice(0,3)} ${n.slice(3,6)} ${n.slice(6,8)} ${n.slice(8)}`;
  }
  return p || "";
}

const digits = p => String(p || "").replace(/\D/g, "");
const waHref = (phone, text) => `https://wa.me/${digits(phone)}?text=${encodeURIComponent(text)}`;
const smsHref = (phone, text) => `sms:${phone}?body=${encodeURIComponent(text)}`;
const dateTR = t => t ? new Date(t).toLocaleString("tr-TR", {dateStyle: "medium", timeStyle: "short"}) : "";

function ago(t) {
  const m = Math.round((Date.now() - new Date(t)) / 60000);
  if (m < 1) return "az önce";
  if (m < 60) return `${m} dakika önce`;
  if (m < 60 * 24) return `${Math.round(m / 60)} saat önce`;
  return `${Math.round(m / 1440)} gün önce`;
}

function show(html, cls = "") { app.className = cls === true ? "wide" : cls; app.innerHTML = html; scrollTo(0, 0); }

const petBadge = (name, code, lost) => `<div class="pet${lost ? " is-lost" : ""}"><div class="ic">${icon("paw", "#fff")}</div>
  <div class="nm">${name ? esc(upTR(name)) : "TASMA QR"}</div><small>${esc(code)}</small></div>`;

function showMessage(title, text) {
  show(`<h1>${esc(title)}</h1><p>${esc(text)}</p><a class="btn ghost" href="${esc(APP ? "#" : BASE)}">${APP ? "Rozetlerim" : "Ana sayfa"}</a>`);
}

// ---------------------------------------------------------------- bu cihazdaki rozetler ve siparişler
const store = {
  get(key, fallback) { try { const v = localStorage.getItem("tasmaqr-" + key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } },
  set(key, value) { try { localStorage.setItem("tasmaqr-" + key, JSON.stringify(value)); } catch (e) {} },
};
const myTags = () => store.get("tags", []);
const findTag = code => myTags().find(t => t.code === code);
function saveTag(tag) {
  const old = findTag(tag.code) || {size: "y35", copies: 1, created: Date.now()}; // tasarım yoksa rozet sayfasında bir kez seçilir
  store.set("tags", [{...old, ...tag}, ...myTags().filter(t => t.code !== tag.code)]);
  syncNative();
}
const removeTag = code => { store.set("tags", myTags().filter(t => t.code !== code)); syncNative(); };
const myOrders = () => store.get("orders", []);
function saveOrder(o) { store.set("orders", [{...myOrders().find(x => x.code === o.code), ...o}, ...myOrders().filter(x => x.code !== o.code)]); syncNative(); }
// Arka plan bildirimleri (android/…/Notifier.java) hangi rozetlere ve siparişlere bakacağını buradan öğrenir
function syncNative() {
  if (!APP) return;
  try {
    NATIVE.syncTags?.(JSON.stringify(myTags().map(t => ({code: t.code, pin: t.pin, name: t.name || ""}))));
    NATIVE.syncOrders?.(JSON.stringify(myOrders().map(o => ({code: o.code, token: o.token, status: o.status}))));
  } catch (e) {}
}
function deviceId() {
  let id = store.get("device", null);
  if (!id) { id = crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now(); store.set("device", id); }
  return id;
}

// ---------------------------------------------------------------- eğlence
function toast(text, ms = 3200) {
  document.querySelector(".toast")?.remove();
  const t = Object.assign(document.createElement("div"), {className: "toast noprint", textContent: text});
  t.setAttribute("role", "status");
  document.body.append(t);
  setTimeout(() => t.remove(), ms);
}

function confetti() {
  const colors = ["#b8501a", "#ffd400", "#0c7a43", "#e05a8a", "#163a7a", "#c98b4f"];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement("div");
    c.className = "confetti noprint";
    c.style.cssText = `left:${Math.random() * 100}vw;background:${colors[i % colors.length]};` +
      `animation-duration:${1.6 + Math.random() * 1.6}s;animation-delay:${Math.random() * .4}s;border-radius:${i % 3 ? 2 : 50}px`;
    document.body.append(c);
    setTimeout(() => c.remove(), 3800);
  }
}

// ---------------------------------------------------------------- bulan kişi: QR okutulunca
function showFound(code, tag) {
  const name = tag.pet_name || "", phone = tag.phone;
  const hello = `Merhaba, ${name ? `${name} adlı evcil hayvanınızı` : "evcil hayvanınızı"} buldum (Tasma QR).`;
  const since = tag.lost_since ? ` (${ago(tag.lost_since)} kayıp olarak işaretlendi)` : "";
  const backup = tag.backup_phone ? `
    <div class="msg info" style="margin-top:18px">Ulaşamazsanız${tag.backup_name ? ` <b>${esc(tag.backup_name)}</b>` : ""}:
      <a href="tel:${esc(tag.backup_phone)}"><b>${esc(prettyPhone(tag.backup_phone))}</b></a></div>
    <a class="btn ghost" href="tel:${esc(tag.backup_phone)}" style="margin-top:8px">Yedek numarayı ara</a>` : "";
  show(`
    ${petBadge(name, code, tag.lost)}
    ${tag.lost ? `<div class="lost" role="alert"><b>🚨 ${name ? esc(upTR(name)) : "BU KÖPEK"} KAYIP!</b>Sahibi onu arıyor${esc(since)}.
      Lütfen hemen arayın ve mümkünse hayvanı güvenli bir yerde tutun.${tag.reward ? `<span class="reward">Ödül: ${esc(tag.reward)}</span>` : ""}</div>` : ""}
    <h1>${name ? `Merhaba, ben ${esc(name)}! 🐾` : "Merhaba, beni buldun! 🐾"}</h1>
    <p>Sahibime ulaşmama yardım eder misin? Aşağıdan arayabilir ya da bulunduğun yeri tek dokunuşla gönderebilirsin.</p>
    ${tag.notes ? `<div class="msg info"><b>Sahibimin notu:</b> ${esc(tag.notes)}</div>` : ""}
    <a class="btn call" href="tel:${esc(phone)}">📞 Sahibimi ara</a>
    <button class="btn loc" type="button" id="loc">📍 Konumumu sahibine gönder</button>
    <div id="locbox"></div>
    <a class="btn ghost" href="${esc(waHref(phone, hello))}">💬 WhatsApp'tan yaz</a>
    <a class="btn ghost" href="${esc(smsHref(phone, hello))}">✉️ SMS gönder</a>
    ${backup}
    <p class="small"><a href="${esc(editLink(code))}">Hayvanın sahibi misiniz? Bilgileri düzenleyin</a></p>`);
  const btn = document.getElementById("loc"), box = document.getElementById("locbox");
  const sendButtons = text => `<a class="btn" href="${esc(waHref(phone, text))}">WhatsApp'tan gönder</a>
    <a class="btn ghost" href="${esc(smsHref(phone, text))}">SMS ile gönder</a>`;
  btn.onclick = () => {
    const fail = why => {
      btn.disabled = false; btn.textContent = "📍 Tekrar dene";
      box.innerHTML = `<div class="msg err" style="margin-top:14px">${esc(why)} Yine de mesajla nerede olduğunuzu yazabilirsiniz.</div>`;
    };
    if (!navigator.geolocation) return fail("Tarayıcınız konum paylaşımını desteklemiyor.");
    btn.disabled = true; btn.textContent = "Konum alınıyor…";
    navigator.geolocation.getCurrentPosition(async pos => {
      const {latitude: lat, longitude: lng, accuracy} = pos.coords;
      const text = `${hello} Şu an buradayız: https://maps.google.com/?q=${lat.toFixed(6)},${lng.toFixed(6)}`;
      let saved = false;
      try { saved = !!(await rpc("tasma_report_location", {p_code: code, p_lat: lat, p_lng: lng, p_accuracy: Math.round(accuracy || 0)}))?.ok; }
      catch (e) {}
      btn.remove();
      box.innerHTML = `<div class="msg ok" style="margin-top:14px"><b>Teşekkürler!</b> Konumunuz alındı${saved ? " ve sahibinin rozet sayfasına kaydedildi" : ""}.
        Sahibine hemen haber vermek için mesajla da gönderin:</div>${sendButtons(text)}`;
      confetti();
    }, err => fail(err.code === 1 ? "Konum izni verilmedi." : "Konum alınamadı."),
    {enableHighAccuracy: true, timeout: 15000, maximumAge: 60000});
  };
}

function showPinGate(code, tag, error = "") {
  const claim = !tag.phone, own = findTag(code);
  const back = APP ? tagPageLink(code) : claim ? BASE : tagLink(code);
  let known = own?.pin || "";
  try { known ||= sessionStorage.getItem("tasmaqr-pin-" + code) || ""; } catch (e) {}
  show(`
    ${claim ? petBadge("", code) : petBadge(tag.pet_name, code, tag.lost)}
    <h1>${claim ? "Rozeti etkinleştirin" : "Rozetin sahibi misiniz?"}</h1>
    <p>${claim ? "Bu rozet henüz kimseye bağlı değil. Önce rozetle gelen PIN kartındaki 6 haneli PIN'i girin; ardından evcil hayvanınızın ve sizin bilgilerinizi yazıp kaydedeceksiniz."
              : "Bilgileri görmek ve değiştirmek için rozetin 6 haneli PIN'ini girin."}</p>
    ${error ? `<div class="msg err" role="alert">${esc(error)}</div>` : ""}
    <form id="gf" novalidate>
      <label for="g-pin">${claim ? "Karttaki PIN" : "PIN"}</label>

      ${known ? `<span class="hint">PIN bu cihazda kayıtlı olduğu için dolduruldu.</span>` : `<span class="hint">${claim ? "PIN, rozetle birlikte gelen kartta yazar." : "PIN'i rozeti oluşturduğunuz cihazda Rozetlerim'de ya da rozetle gelen kartta bulabilirsiniz."}</span>`}
      <button class="btn" type="submit">Devam</button>
    </form>
    <p class="small"><a href="${esc(back)}">Vazgeç</a></p>`, "mid");
  const input = document.getElementById("g-pin");
  if (!known) input.focus();
  document.getElementById("gf").addEventListener("submit", async ev => {
    ev.preventDefault();
    const pin = input.value.trim();
    if (!/^\d{6}$/.test(pin)) return showPinGate(code, tag, "PIN 6 haneli olmalı.");
    ev.submitter && (ev.submitter.disabled = true);
    let r;
    try {
      r = await rpc("tasma_tag_unlock", {p_code: code, p_pin: pin}).catch(async e => {
        if (e.status !== 404) throw e;  // veritabanı güncellenmediyse eski yolla doğrula
        const rows = await rpc("tasma_tag_stats", {p_codes: [code], p_pins: [pin]});
        return rows?.[0] ? {ok: true} : {ok: false, error: "bad_pin"};
      });
    } catch (e) { return showPinGate(code, tag, "Bağlantı hatası. İnternetinizi kontrol edip tekrar deneyin."); }
    if (!r?.ok) {
      return showPinGate(code, tag, {bad_pin: claim ? "PIN hatalı. Rozetle gelen karttaki 6 haneli PIN'i girin." : "PIN hatalı.",
        locked: `Çok fazla yanlış deneme. ${r?.minutes || 15} dakika sonra tekrar deneyin.`, not_found: "Bu rozet bulunamadı."}[r?.error] || "PIN doğrulanamadı, tekrar deneyin.");
    }
    const {ok, claimed, ...fresh} = r;
    showEdit(code, {...tag, ...fresh}, "", null, pin);
  });
}

// Bu cihazdaki bütün rozetleri sunucudan siler, cihazdaki listeyi, adresi ve siparişleri temizler (Play veri silme şartı)
async function wipeAll() {
  const tags = myTags();
  if (!confirm(`Bu ${APP ? "telefondaki" : "cihazdaki"} ${tags.length} rozet sunucudan kalıcı olarak silinsin ve adres, sipariş listesi temizlensin mi?\n\nRozetlerin QR'ı artık hiçbir bilgi göstermez. Bu işlem geri alınamaz.`)) return;
  let failed = 0;
  for (const t of tags) {
    try { const r = await rpc("tasma_tag_delete", {p_code: t.code, p_pin: t.pin}); if (r?.ok || r?.error === "not_found") removeTag(t.code); else failed++; }
    catch (e) { failed++; }
  }
  if (failed) return toast(`${failed} rozet silinemedi (bağlantı ya da PIN hatası). Tekrar deneyin.`, 6000);
  ["orders", "address", "lastPhone", "lastDesign"].forEach(k => { try { localStorage.removeItem("tasmaqr-" + k); } catch (e) {} });
  syncNative();
  toast("Tüm verileriniz silindi.");
  location.hash = "#"; route();
}

// Rozeti sunucudan siler (PIN ile). Yönetimden basılan rozet boşa çıkar, PIN kartıyla yeniden bağlanabilir.
async function deleteTag(code, pin, name) {
  if (!confirm(`${name || code} rozeti silinsin mi?\n\nQR artık hiçbir bilgi göstermez; okutmalar ve gönderilen konumlar da silinir. Bu işlem geri alınamaz.`)) return false;
  let r;
  try { r = await rpc("tasma_tag_delete", {p_code: code, p_pin: pin}); }
  catch (e) { toast(e.status === 404 ? "Silme özelliği için veritabanını güncelleyin (kurulum.sql'i yeniden çalıştırın)." : "Bağlantı hatası, tekrar deneyin.", 6000); return false; }
  if (!r?.ok) {
    toast({bad_pin: "PIN hatalı.", locked: `Çok fazla yanlış deneme. ${r?.minutes || 15} dakika sonra tekrar deneyin.`, not_found: "Bu rozet zaten silinmiş."}[r?.error] || "Silinemedi.", 5000);
    if (r?.error === "not_found") removeTag(code);
    return r?.error === "not_found";
  }
  removeTag(code);
  toast(r.reset ? "Rozet silindi. Aynı PIN kartıyla yeniden bağlanabilir." : "Rozet silindi.", 5000);
  return true;
}

const PX = 25.4 / 96; // CSS px -> mm

async function snap(el) {
  const r = el.getBoundingClientRect();
  const canvas = await html2canvas(el, {scale: 6, backgroundColor: "#ffffff", logging: false});
  return {img: canvas.toDataURL("image/png"), w: r.width * PX, h: r.height * PX};
}

// Görüntüleri A4'e gerçek boyutlarıyla dizer
function layoutA4(pdf, shots) {
  const {W, H, M, G} = A4;
  let x = M, y = M, rowH = 0, first = true;
  for (const s of shots) {
    if (x + s.w > W - M + .1) { x = M; y += rowH + G; rowH = 0; }
    if (y + s.h > H - M + .1) { pdf.addPage(); x = M; y = M; rowH = 0; }
    pdf.addImage(s.img, "PNG", x, y, s.w, s.h, undefined, "FAST");
    x += s.w + G; rowH = Math.max(rowH, s.h); first = false;
  }
  return !first;
}

const singlePage = size => { const {w, h} = dims(size); return {w: Math.max(w, 46), h: Math.max(h, 32)}; };

// Sıkıştırmasız (store) ZIP: dış kütüphane gerektirmez. files: [{name, data: string | Uint8Array}]
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function makeZip(files) {
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  const u16 = v => [v & 255, (v >>> 8) & 255], u32 = v => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
  for (const f of files) {
    const name = enc.encode(f.name), data = typeof f.data === "string" ? enc.encode(f.data) : f.data, crc = crc32(data);
    // sürüm, UTF-8 bayrağı (0x0800), yöntem 0 (store), saat/tarih 0
    const common = [...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(name.length), ...u16(0)];
    const local = new Uint8Array([...u32(0x04034b50), ...common]);
    parts.push(local, name, data);
    central.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...common, ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset)]), name);
    offset += local.length + name.length + data.length;
  }
  const cdSize = central.reduce((n, p) => n + p.length, 0);
  const end = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(cdSize), ...u32(offset), ...u16(0)]);
  return new Blob([...parts, ...central, end], {type: "application/zip"});
}

function downloadBlob(blob, name) {
  const a = Object.assign(document.createElement("a"), {href: URL.createObjectURL(blob), download: name});
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function showRequest() {
  show(`
    <div class="page-head"><span class="eyebrow">Hazır rozet</span><h1>Rozetinizi biz hazırlayalım</h1>
      <p>Rozet tipini, tasarımı ve ölçüyü seçin. Rozetiniz PIN kartıyla birlikte hazırlanır; dosya seçerseniz e-postayla ya da WhatsApp'tan göndeririz.</p></div>
    <div class="card" id="formbox">${requestFormHtml()}</div>`, "mid");
  bindRequestForm();
}

const REQUEST_KINDS = {epoksi: "Renkli epoksi rozet", metal: "Metal lazer rozet", dosya: "Dosya olarak gönderin, kendim basarım"};
const reqKind = v => REQUEST_KINDS[v.kind] ? v.kind : "epoksi";
const reqSizes = v => reqKind(v) === "dosya" ? SIZES : BADGE_SIZES;
const reqSize = v => reqSizes(v)[v.size] ? v.size : (reqKind(v) === "dosya" ? "y35" : "y30");
const requestPreview = v => typeof qrcode !== "function" ? "" : reqKind(v) === "dosya"
  ? tagAt("ÖRNEK", v.design || "klasik", reqSize(v), {link: SITE, name: v.pet || ""})
  : `<div style="zoom:1.8">${badgeAt("ÖRNEK", v.design || "klasik", reqSize(v), {link: SITE, name: v.pet || "", kind: reqKind(v)})}</div>`;

function requestFormHtml(error = "", v = {}) {
  const val = k => `value="${esc(v[k] || "")}"`;
  return `
    ${error ? `<div class="msg err" role="alert">${esc(error)}</div>` : ""}
    <form id="rf" novalidate>
      <div class="row2">
        <div><label for="r-first">Ad</label><input id="r-first" autocomplete="given-name" required ${val("first")}></div>
        <div><label for="r-last">Soyad</label><input id="r-last" autocomplete="family-name" required ${val("last")}></div>
      </div>
      <label for="r-email">E-posta</label>
      <input id="r-email" type="email" inputmode="email" autocomplete="email" placeholder="ornek@mail.com" required ${val("email")}>
      <label for="r-phone">Telefon <span class="opt">(isteğe bağlı)</span></label>
      <input id="r-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="05xx xxx xx xx" aria-describedby="r-phone-hint" ${val("phone")}>
      <span id="r-phone-hint" class="hint">Rozeti WhatsApp'tan isterseniz telefonunuzu girin.</span>
      <label for="r-pet">Evcil hayvanınızın adı <span class="opt">(isteğe bağlı)</span></label>
      <input id="r-pet" maxlength="20" ${val("pet")}>
      <label>Rozet tipi</label>
      <div class="designs" id="r-kind" role="radiogroup" aria-label="Rozet tipi">${Object.entries(REQUEST_KINDS).map(([k, n]) =>
        `<button type="button" role="radio" aria-checked="${k === reqKind(v)}" data-kind="${k}" class="${k === reqKind(v) ? "on" : ""}">${esc(n)}</button>`).join("")}</div>
      <div class="preview" id="r-pv" style="margin-top:12px">${requestPreview(v)}</div>
      ${reqKind(v) === "metal" ? `<span class="hint">Metal rozet tek renktir: QR ve ad paslanmaz çeliğe lazerle kazınır.</span>` : `<label>Tasarım</label>${designChips(v.design || "klasik")}`}
      <label for="r-size">Ölçü</label>
      <select id="r-size" class="big">${Object.entries(reqSizes(v)).map(([k, n]) => `<option value="${k}"${k === reqSize(v) ? " selected" : ""}>${esc(n)}</option>`).join("")}</select>
      <label for="r-note">Notunuz <span class="opt">(isteğe bağlı: adet, renk tercihi…)</span></label>
      <textarea id="r-note" rows="3" maxlength="500">${esc(v.note || "")}</textarea>
      <div class="hp" aria-hidden="true"><label for="r-web">Web sitesi</label><input id="r-web" tabindex="-1" autocomplete="off"></div>
      <label class="check"><input type="checkbox" id="r-ok"${v.ok ? " checked" : ""}> Bilgilerimin yalnızca rozet talebimin işlenmesi ve benimle iletişim kurulması amacıyla kullanılmasını kabul ediyorum.</label>
      <button class="btn" type="submit">Talep gönder</button>
    </form>`;
}

function bindRequestForm(state = {}) {
  const form = document.getElementById("rf"), pv = document.getElementById("r-pv");
  const sel = {design: state.design || "klasik", kind: reqKind(state), size: reqSize(state)};
  const redraw = () => { pv.innerHTML = requestPreview({...sel, pet: document.getElementById("r-pet").value.trim()}); };
  const values = () => { const g = id => document.getElementById(id); return {first: g("r-first").value.trim(), last: g("r-last").value.trim(),
    email: g("r-email").value.trim(), phone: g("r-phone").value.trim(), pet: g("r-pet").value.trim(), note: g("r-note").value, ok: g("r-ok").checked, ...sel}; };
  document.getElementById("r-kind").onclick = ev => {
    const b = ev.target.closest("[data-kind]");
    if (!b) return;
    const v = {...values(), kind: b.dataset.kind}, box = document.getElementById("formbox");
    box.innerHTML = requestFormHtml("", v); bindRequestForm(v);
  };
  form.querySelector(".designs:not(#r-kind)")?.addEventListener("click", ev => {
    const b = ev.target.closest("[data-d]");
    if (!b) return;
    sel.design = b.dataset.d;
    form.querySelectorAll(".designs:not(#r-kind) button").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-checked", x === b); });
    redraw();
  });
  document.getElementById("r-size").onchange = ev => { sel.size = ev.target.value; redraw(); };
  let timer;
  document.getElementById("r-pet").oninput = () => { clearTimeout(timer); timer = setTimeout(() => document.getElementById("r-pet") && redraw(), 150); };
  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    const g = id => document.getElementById(id);
    const v = {first: g("r-first").value.trim(), last: g("r-last").value.trim(), email: g("r-email").value.trim(),
      phone: g("r-phone").value.trim(), pet: g("r-pet").value.trim(), note: g("r-note").value.trim(), ok: g("r-ok").checked, ...sel};
    const box = g("formbox");
    const fail = msg => { box.innerHTML = requestFormHtml(msg, v); bindRequestForm(v); box.querySelector(".msg").scrollIntoView({block: "center"}); };
    if (!v.first || !v.last) return fail("Ad ve soyadınızı yazın.");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email)) return fail("E-posta adresi geçersiz. Örnek: ornek@mail.com");
    const phone = v.phone ? normalizePhone(v.phone) : null;
    if (v.phone && !phone) return fail("Telefon numarası geçersiz (örnek: 0532 123 45 67). İstemiyorsanız boş bırakabilirsiniz.");
    if (!v.ok) return fail("Devam etmek için bilgilendirme onayını işaretleyin.");
    const done = () => {
      box.innerHTML = `<div class="msg ok" role="status"><b>Talebiniz alındı, teşekkürler ${esc(v.first)}!</b><br>${phone ? `Rozetinizi ${esc(prettyPhone(phone))} numarasına WhatsApp'tan göndereceğiz.` : `En kısa sürede ${esc(v.email)} adresinden size ulaşacağız.`}</div>`;
      confetti();
    };
    if (g("r-web").value) return done(); // bot tuzağı: sessizce geç
    ev.submitter && (ev.submitter.disabled = true);
    const args = {p_first_name: v.first, p_last_name: v.last, p_email: v.email, p_phone: phone, p_pet_name: v.pet || null, p_note: v.note || null};
    const choice = `${REQUEST_KINDS[v.kind]} · Tasarım: ${DESIGNS[v.design]?.name || v.design} · Ölçü: ${SIZES[v.size] || v.size}`;
    try {
      // veritabanı henüz güncellenmediyse (eski imza) seçimi notla gönder
      const res = await rpc("tasma_request_create", {...args, p_design: v.kind === "metal" ? null : v.design, p_size: v.size, p_kind: v.kind}).catch(e => {
        if (e.status !== 404) throw e;
        return rpc("tasma_request_create", {...args, p_note: [v.note, choice].filter(Boolean).join("\n")});
      });
      if (res?.ok) return done();
      fail({missing: "Ad ve soyadınızı yazın.", bad_email: "E-posta adresi geçersiz.", bad_phone: "Telefon numarası geçersiz.",
        too_many: "Bugün bu bilgilerle zaten talep gönderdiniz; sizinle iletişime geçeceğiz.",
        busy: "Şu an çok yoğunuz, birkaç dakika sonra tekrar deneyin."}[res?.error] || "Talep gönderilemedi, tekrar deneyin.");
    } catch (e) {
      fail("Bağlantı hatası. İnternetinizi kontrol edip tekrar deneyin.");
    }
  });
}

const loadStats = async tags => {
  if (!tags.length) return {};
  try {
    const rows = await rpc("tasma_tag_stats", {p_codes: tags.map(t => t.code), p_pins: tags.map(t => t.pin)});
    const map = Object.fromEntries((rows || []).map(r => [r.code, r]));
    // sunucudaki güncel ad ve numarayı yerelde de güncelle
    tags.forEach(t => { const r = map[t.code]; if (r && (r.pet_name !== t.name || r.phone !== t.phone)) saveTag({code: t.code, name: r.pet_name, phone: r.phone}); });
    return map;
  } catch (e) { return {}; }
};

const PAID_STATUSES = ["onaylandi", "baskida", "kargolandi"];
async function refreshOrders() {
  const list = myOrders();
  if (!list.length) return;
  try {
    const rows = await rpc("tasma_order_status", {p_codes: list.map(o => o.code), p_tokens: list.map(o => o.token)});
    (rows || []).forEach(r => saveOrder({code: r.code, status: r.status, tracking: r.tracking}));
    // ödemesi onaylanan siparişin tasarımı rozete işlenir
    myOrders().forEach(o => {
      if (PAID_STATUSES.includes(o.status) && o.design && DESIGNS[o.design] && findTag(o.tag) && findTag(o.tag).design !== o.design && !o.applied) {
        saveTag({code: o.tag, design: o.design}); saveOrder({code: o.code, applied: true});
      }
    });
  } catch (e) {}
}

      await loadPdfLibs();

  };

    ev.target.disabled = true;

  g("forget").onclick = ev => {
    ev.preventDefault();

  };

    g("sightings").innerHTML = s.sightings.length ? `<h2>📍 Bulan kişilerin gönderdiği konumlar</h2><ol class="sight">${s.sightings.map(x =>
      `<li><a href="https://maps.google.com/?q=${x.lat},${x.lng}" target="_blank" rel="noopener">${esc(dateTR(x.at))}</a> · ${esc(ago(x.at))}${x.accuracy ? ` · ±${esc(x.accuracy)} m` : ""}</li>`).join("")}</ol>` : "";
    const lostHtml = () => s.lost
      ? `<div class="lost"><b>🚨 Kayıp modu açık</b>QR'ı okutan kişi kırmızı uyarıyı görüyor.<button class="btn ghost" type="button" id="lostbtn">${esc(t.name || "Dostum")} bulundu, kayıp modunu kapat</button></div>`
      : `<button class="btn danger" type="button" id="lostbtn" style="margin:0 0 16px">🚨 Dostum kayboldu: kayıp modunu aç</button>`;
    g("lostbox").innerHTML = lostHtml();
    g("lostbox").onclick = async ev => {
      if (ev.target.id !== "lostbtn") return;

      ev.target.disabled = true;
      try {
        const r = await rpc("tasma_tag_set_lost", {p_code: code, p_pin: t.pin, p_lost: on});
        if (!r?.ok) throw new Error(r?.error === "bad_pin" ? "PIN hatalı" : r?.error === "locked" ? "çok fazla deneme, biraz bekleyin" : "kaydedilemedi");

      } catch (e) { ev.target.disabled = false; toast("İşlem yapılamadı: " + e.message, 5000); }

  // basılı rozet satışı açıksa sipariş kartı

const SUPABASE_REF = new URL(SUPABASE_URL).hostname.split(".")[0];

function setupHtml(text) {

    <b>3.</b> yapıştırın, en üstteki <b>v_sifre</b> satırına admin şifrenizi yazın ve <b>Run</b>'a basın, <b>4.</b> bu sayfayı yenileyin.

      <button class="btn" type="button" data-sql="supabase/kurulum.sql">1. SQL'i kopyala</button>

document.addEventListener("click", async ev => {
  const btn = ev.target.closest("button[data-sql]");
  if (!btn) return;
  const box = btn.closest(".setup");
  let sql;
  try {
    const r = await fetch(btn.dataset.sql, {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    sql = await r.text();
  } catch (e) {
    const url = `https://raw.githubusercontent.com/yusufbas34/tasmaqr/main/${btn.dataset.sql}`;
    return box.insertAdjacentHTML("beforeend", `<p style="margin:10px 0 0">SQL yüklenemedi. <a href="${esc(url)}" target="_blank" rel="noopener">Buradan açıp</a> tümünü seçerek kopyalayın.</p>`);
  }
  try {
    await navigator.clipboard.writeText(sql);
    btn.textContent = "✓ Kopyalandı";
    toast("SQL kopyalandı. Şimdi SQL Editor'ı açıp yapıştırın.");
  } catch (e) {
    box.querySelector("textarea")?.remove();
    const ta = Object.assign(document.createElement("textarea"), {value: sql, rows: 8, readOnly: true});
    ta.style.marginTop = "10px";
    box.append(ta); ta.focus(); ta.select();
    toast("Metin seçildi; uzun basıp Kopyala deyin.");
  }
});

// A4: rozetleri gerçek boyutlarıyla sayfaya dizer. Tek: her rozet / PIN kartı kendi sayfasında (matbaa, etiket yazıcısı).
async function savePdf(codes) {
  await loadPdfLibs();
  const {jsPDF} = window.jspdf;
  const tags = codes.map(c => document.querySelector(`.tag[data-code="${CSS.escape(c)}"]`)).filter(Boolean);
  let pdf;
  if (paper === "tek") {
    const {w, h} = singlePage(stickerSize), fmt = [w, h];
    for (const tag of tags) {
      for (const el of tag.querySelectorAll(".sticker, .pin")) {
        if (!el.offsetParent) continue; // seçili modda gizli
        const s = await snap(el);
        if (pdf) pdf.addPage(fmt, "portrait"); else pdf = new jsPDF({unit: "mm", format: fmt, orientation: "portrait"});
        pdf.addImage(s.img, "PNG", (w - s.w) / 2, (h - s.h) / 2, s.w, s.h, undefined, "FAST");
      }
    }
  } else {
    pdf = new jsPDF({unit: "mm", format: "a4"});
    const shots = [];
    for (const tag of tags) shots.push(await snap(tag.querySelector(".block")));
    if (!layoutA4(pdf, shots)) pdf = null;
  }
  if (!pdf) throw new Error("Kaydedilecek rozet yok");
  const name = codes.length === 1 ? `kunye-${codes[0]}` : `kunyeler-${codes.length}`;
  savePdfFile(pdf, `${name}-${stickerSize}.pdf`);
}

// Yazdırır ya da PDF kaydeder; ardından verilmemiş olanları verildi olarak işaretlemeyi önerir.
async function deliver(codes, how) {
  if (!codes.length) return;
  if (how === "pdf") {
    toast("PDF hazırlanıyor…", 60000);
    try { await savePdf(codes); toast("PDF kaydedildi."); }
    catch (e) { document.querySelector(".toast")?.remove(); return adminError("PDF oluşturulamadı: " + e.message); }
  } else {
    document.querySelectorAll(".tag").forEach(t => t.classList.toggle("skip", !codes.includes(t.dataset.code)));
    await new Promise(done => { addEventListener("afterprint", done, {once: true}); print(); });
    document.querySelectorAll(".tag.skip").forEach(t => t.classList.remove("skip"));
  }
  const fresh = codes.filter(c => document.querySelector(`.tag[data-code="${CSS.escape(c)}"]`)?.dataset.state === "ready");
  if (!fresh.length) return;
  if (!confirm(`${fresh.length} rozet verildi olarak işaretlensin mi? Verilen rozetler bu listede bir daha görünmez.`)) return;
  try {
    await setGiven(fresh, true);
    await showAdmin();
    confetti();
    toast(fresh.length === 1 ? `${fresh[0]} yeni dostuna kavuştu!` : `${fresh.length} rozet yeni dostlarına yolculuğa çıktı!`);
  } catch (e) { adminError("İşaretlenemedi: " + e.message); }
}

epoksi/ : alüminyum gövde, UV renkli baskı + şeffaf epoksi kubbe. Kırmızı çizgiler basılmaz.

Teslimden önce birkaç rozeti telefonla okutup doğru adresi açtığını kontrol ediniz.
Halka (split ring) ile birlikte paketleyiniz.
`},

    ev.target.disabled = true;

    catch (e) { ev.target.disabled = false; return adminError("Rozet üretilemedi: " + e.message); }

}

// Sayfaları (210×297 mm div) tek tek görüntüleyip A4 PDF yapar
async function pagesPdf(pages, scale) {
  await loadPdfLibs();
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;left:-30000px;top:0";
  document.body.append(box);
  try {
    const pdf = new window.jspdf.jsPDF({unit: "mm", format: "a4"});
    for (let i = 0; i < pages.length; i++) {
      toast(`PDF hazırlanıyor… sayfa ${i + 1}/${pages.length}`, 60000);
      box.innerHTML = `<div class="a4page">${pages[i]}</div>`;
      const canvas = await html2canvas(box.firstElementChild, {scale, backgroundColor: "#ffffff", logging: false});
      if (i) pdf.addPage("a4", "portrait");
      pdf.addImage(canvas.toDataURL("image/png"), "PNG", 0, 0, 210, 297, undefined, "FAST");
    }
    return pdf;
  } finally { box.remove(); }
}

            <button class="mini alt" data-act="badges" title="Rozetler A4'e gerçek boyutta dizilir (kırmızı çizgi = kesim)">🖨 Rozet baskı PDF (A4)</button>
            <button class="mini alt" data-act="pins" title="85×55 mm kartvizit ölçüsü, A4'e 10 kart">🔑 PIN kartları PDF</button>
            <button class="mini ghost" data-act="pincsv" title="Yalnızca sizde kalsın, fabrikaya göndermeyin">PIN listesi (CSV)</button>
            <button class="mini ghost" data-act="forget" title="Parti bu listeden kalkar; kodlar ve PIN'ler silinmez">Listeden kaldır</button>
          </div>
        </div>`;
      }).join("")}
    </div>
    <p class="hint">Fabrikaya yalnızca <b>Fabrika paketi</b>'ni gönderin. PIN kartlarını kendiniz basıp her rozetin poşetine <b>aynı kodlu</b> kartı koyun.
      Partiler bu tarayıcıda listelenir; başka cihazda göremezsiniz ama kodlar ve PIN'ler veritabanında durur (Rozetler › Verilmiş rozetler).</p>
    <p class="hint">3D yazıcıda basılan gövde + QR etiket için: <a href="uretim/3d/" target="_blank">STL/3MF dosyaları ve etiket sayfası</a> (kodları oraya yapıştırın).</p>`, true);
  bindTabs();
  const $ = id => document.getElementById(id);
  const read = () => {
    stockForm = {n: Math.min(500, Math.max(1, parseInt($("st-n").value, 10) || 0)), kind: $("st-kind").value, size: $("st-size").value,
      design: $("st-design").value, top: $("st-top").value};
    const p = {...stockForm, design: stockForm.kind === "metal" ? "klasik" : stockForm.design};
    $("st-design-box").hidden = stockForm.kind === "metal";
    document.querySelectorAll(".stockprev .badgebox").forEach(el => { el.outerHTML = stockBadge("ÖRNEK", p); });
  };
  ["st-kind", "st-size", "st-design", "st-top"].forEach(id => $(id).onchange = read);
  $("stf").onsubmit = async ev => {
    ev.preventDefault(); read();
    const btn = $("st-make"), n = stockForm.n;
    if (!confirm(`${n} adet ${PRODUCTS[stockForm.kind].name} (${BADGE_SIZES[stockForm.size]}) için yeni kod oluşturulsun mu?`)) return;
    btn.disabled = true;
    try {
      const before = new Set(rows.map(r => r.code));
      for (let left = n; left > 0; left -= 100) await rpc("tasma_admin_add", {p_key: adminKey, p_count: Math.min(100, left)});
      const fresh = (await rpc("tasma_admin_list", {p_key: adminKey})).filter(r => !before.has(r.code)).map(r => r.code);
      if (!fresh.length) throw new Error("kod oluşmadı");
      await setGiven(fresh, true);
      saveBatches([{date: new Date().toISOString(), ...stockForm, design: stockForm.kind === "metal" ? "klasik" : stockForm.design, codes: fresh}, ...loadBatches()]);
      await showAdmin();
      toast(`${fresh.length} rozetlik parti oluşturuldu. Şimdi dosyaları indirin.`, 5000);
    } catch (e) { btn.disabled = false; adminError("Parti oluşturulamadı: " + e.message); }
  };
  document.querySelector(".reqs").onclick = async ev => {
    const btn = ev.target.closest("button[data-act]");
    if (!btn) return;
    const b = batches[btn.closest(".req").dataset.i], act = btn.dataset.act, name = batchName(b);
    btn.disabled = true;
    try {
      if (act === "zip") {
        downloadBlob(makeZip(stockFiles(b)), `${name}-fabrika.zip`);
        toast("Fabrika paketi indirildi (PIN içermez).", 4000);
      } else if (act === "pincsv") {
        downloadBlob(new Blob([csvText([["sira", "kod", "pin", "qr_baglanti", "durum"],
          ...b.codes.map((c, i) => [i + 1, c, byCode[c].pin, tagLink(c), byCode[c].phone ? "bağlandı" : "stokta"])])], {type: "text/csv"}), `${name}-PIN-listesi.csv`);
        toast("PIN listesi indirildi. Bu dosyayı kimseyle paylaşmayın.", 5000);
      } else if (act === "pins") {
        const pdf = await pagesPdf(chunk(b.codes.map(c => byCode[c]), 10).map(p => `<div class="pinsheet">${p.map(pinCardHtml).join("")}</div>`), 3);
        savePdfFile(pdf, `${name}-PIN-kartlari.pdf`);
        toast("PIN kartları kaydedildi. %100 ölçekle basıp kesik çizgilerden kesin.", 5000);
      } else if (act === "badges") {
        const d = dims(b.size).w, h = d * 1.16, cols = Math.floor(193 / (d + 3)), per = cols * Math.floor(280 / (h + 3));
        const pdf = await pagesPdf(chunk(b.codes, per).map(p => `<div class="badgesheet" style="grid-template-columns:repeat(${cols},${d}mm)">${
          p.map(c => `<div>${stockBadge(c, b, true)}<small>${esc(c)}</small></div>`).join("")}</div>`), 5);
        savePdfFile(pdf, `${name}-rozet-baski.pdf`);
        toast("Rozet baskı PDF'i kaydedildi.", 4000);
      } else if (act === "forget") {
        if (!confirm("Parti listeden kaldırılsın mı? Kodlar ve PIN'ler silinmez.")) return;
        saveBatches(loadBatches().filter(x => x.date !== b.date));
        return showAdmin();
      }
    } catch (e) { document.querySelector(".toast")?.remove(); adminError("İşlem yapılamadı: " + e.message); }
    finally { btn.disabled = false; }
  };
}

      const pdf = new window.jspdf.jsPDF({unit: "mm", format: [w, h], orientation: "portrait"});

        toast(`PDF hazırlanıyor… ${i + 1}/${els.length}`, 120000);

      }
      savePdfFile(pdf, name);
      toast("PDF kaydedildi.");
    } catch (e) { document.querySelector(".toast")?.remove(); adminError("PDF oluşturulamadı: " + e.message); }
  };

  const offscreen = async html => {
    const box = document.createElement("div"); box.style.cssText = "position:fixed;left:-40000px;top:0"; box.innerHTML = html; document.body.append(box);

      await loadPdfLibs();
      const imgs = [];
      for (const el of box.querySelectorAll(".kp")) imgs.push((await html2canvas(el, {scale: 4, backgroundColor: "#ffffff", logging: false})).toDataURL("image/jpeg", .92));
      const pdf = new window.jspdf.jsPDF({unit: "mm", format: "a4", orientation: "landscape"});
      const W = 74.25, H = 105;
      KIT_FACES.forEach(([l, r], face) => {
        if (face) pdf.addPage("a4", "landscape");
        for (let i = 0; i < 4; i++) {
          const x = (i % 2) * 2 * W, y = Math.floor(i / 2) * H;
          pdf.addImage(imgs[l], "JPEG", x, y, W, H, undefined, "FAST");
          pdf.addImage(imgs[r], "JPEG", x + W, y, W, H, undefined, "FAST");
        }
        pdf.setDrawColor(102).setLineWidth(.25).setLineDashPattern([], 0);
        [[0, 105, 4, 105], [293, 105, 297, 105], [148.5, 0, 148.5, 4], [148.5, 206, 148.5, 210]].forEach(a => pdf.line(...a));
        pdf.setDrawColor(150).setLineDashPattern([1, 1], 0);
        [74.25, 222.75].forEach(x => { pdf.line(x, 0, x, 3); pdf.line(x, 207, x, 210); });
      });
      savePdfFile(pdf, "tasmaqr-kullanim-kitapcigi-A4-4lu.pdf");
      toast("PDF kaydedildi.");
    } catch (e) { document.querySelector(".toast")?.remove(); adminError("PDF oluşturulamadı: " + e.message); }
    box.remove(); ev.target.disabled = false;
  };
  $("kt-pdf6").onclick = async ev => { ev.target.disabled = true; const box = await offscreen(pages.join(""));
    await pdfOf([...box.querySelectorAll(".kp")], 105, 148, "tasmaqr-kullanim-kitapcigi-A6.pdf"); box.remove(); ev.target.disabled = false; };
}

    pdf.addImage(await shot(`<div class="bc-bleed back">${back}</div>`), "JPEG", 0, 0, 91, 61, undefined, "FAST");
    savePdfFile(pdf, "tasmaqr-kartvizit-matbaa-91x61.pdf");
  });
}

    const cell = (v, c) => { let t = String(v ?? ""); if (c !== "phone" && /^[=+\-@\t\r]/.test(t)) t = "'" + t; return `"${t.replace(/"/g, '""')}"`; };

// Siparişin A4 baskı PDF'i: aynı QR 7 ölçüde 29 rozet (shared/tag.js orderSheetHtml)
// Siparişin üretim dosyası. Rozet: tek rozet, gerçek ölçüde (epoksi: PDF, metal: lazer için SVG).
// Eski sticker siparişleri: A4 sayfada 7 ölçüde 29 rozet (shared/tag.js orderSheetHtml).
const orderLink = o => tagLink(o.tag_code);
const badgeFile = o => new Blob([badgeFileSvg(o.tag_code, o.design, {link: orderLink(o), name: o.pet_name || "", kind: o.kind, size: o.size || "y30"})], {type: "image/svg+xml"});

async function orderPdf(o) {
  await loadPdfLibs();
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;left:-30000px;top:0;background:#fff";
  const sticker = !PRODUCTS[o.kind];
  box.innerHTML = sticker ? orderSheetHtml(o.tag_code, o.design, orderLink(o), o.pet_name || "")
    : badgeAt(o.tag_code, o.design, o.size || "y30", {link: orderLink(o), name: o.pet_name || "", kind: o.kind, file: true});
  document.body.append(box);
  try {
    const el = box.firstElementChild, r = el.getBoundingClientRect();
    const canvas = await html2canvas(el, {scale: sticker ? 4 : 16, backgroundColor: "#ffffff", logging: false});
    const w = r.width * PX, h = r.height * PX;
    const pdf = sticker ? new window.jspdf.jsPDF({unit: "mm", format: "a4"}) : new window.jspdf.jsPDF({unit: "mm", format: [w + 10, h + 10], orientation: "portrait"});
    if (sticker) pdf.addImage(canvas.toDataURL("image/png"), "PNG", 10, 10, 190, 277, undefined, "FAST");
    else pdf.addImage(canvas.toDataURL("image/png"), "PNG", 5, 5, w, h, undefined, "FAST");
    return pdf.output("blob");
  } finally { box.remove(); }
}

// Baskıcıya gidecek ana dosya: metalde SVG (lazer yazılımı vektör ister), diğerlerinde PDF
async function productionFile(o) {
  return o.kind === "metal" ? {blob: badgeFile(o), name: `lazer-${o.code}.svg`, type: "image/svg+xml"}

    metal: `Ekteki SVG'yi Ø${d} mm, kulaklı (halka delikli) paslanmaz çelik rozete fiber lazerle koyu (siyah) markalama olarak 1 adet kazımanızı rica ederim. Siyah alanlar kazınacak; kırmızı çizgiler kesim/kenar çizgisidir. Teslimden önce QR kodun telefonla okunduğunu kontrol eder misiniz? Halkası (split ring) ile birlikte gönderilecektir.`,
  }[o.kind] || `Ekteki A4 sayfayı su geçirmez, UV dayanımlı vinil sticker olarak 1 adet basmanızı rica ederim. Rozetler kesim çizgileriyle birlikte dosyadadır.`;

${what}

Sipariş no: ${o.code}
Teslimat adresi:
${o.full_name}
${o.address}
${o.district} / ${o.city}

Teşekkürler.`;

    } finally { btn.disabled = false; }

// TR IBAN: TR + 24 rakam, mod 97 kontrolü
function validIban(iban) {
  const s = iban.replace(/\s/g, "").toUpperCase();
  if (!/^TR\d{24}$/.test(s)) return false;
  const num = (s.slice(4) + s.slice(0, 4)).replace(/[A-Z]/g, c => c.charCodeAt(0) - 55);
  let r = 0;
  for (const ch of num) r = (r * 10 + Number(ch)) % 97;
  return r === 1;
}

    if (!(price >= 0)) return showSettings(newCount, "Fiyat geçersiz.");
    if (g("s-notify") && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(g("s-notify"))) return showSettings(newCount, "Bildirim e-postası geçersiz.");
    const args = {p_key: adminKey, p_active: active, p_price: price, p_iban: iban, p_account_name: g("s-name"),
      p_bank_name: g("s-bank"), p_printer_email: g("s-printer"), p_shipping_text: g("s-ship"), p_product_text: g("s-product"),
      p_telegram_bot_token: g("s-tg-token"), p_telegram_chat_id: g("s-tg-chat"), p_resend_api_key: g("s-resend"), p_notify_email: g("s-notify")};
    try {
      let old = false;
      // Veritabanı eski sürümdeyse (metal fiyatı alanı yok) diğer ayarları yine kaydet, güncelleme uyarısı göster
      await rpc("tasma_admin_shop_set", {...args, p_price_metal: priceMetal}).catch(async e => {
        if (e.status !== 404) throw e;
        old = true;
        await rpc("tasma_admin_shop_set", args);
      });
      await showSettings(newCount, old ? "Ayarlar kaydedildi, ama metal rozet fiyatı kaydedilemedi: veritabanı eski sürümde. Supabase SQL Editor'da güncel supabase/kurulum.sql dosyasını çalıştırın; metal rozet siparişleri de ancak o zaman çalışır." : "");
      toast(active ? "Kaydedildi. Satış açık." : "Kaydedildi. Satış kapalı.");
    } catch (e) { showSettings(newCount, "Kaydedilemedi: " + e.message); }
  });
}

// ---------------------------------------------------------------- yönlendirme
async function route() {
  if (SUPABASE_URL.includes("BURAYA") || SUPABASE_KEY.includes("BURAYA")) {
    return showMessage("Kurulum eksik", "index.html dosyasının başındaki SUPABASE_URL ve SUPABASE_KEY değerlerini doldurun.");
  }
  if (params.has("admin")) return showAdminLogin();

  const code = (params.get("k") || "").trim().toUpperCase();
  if (code) {
    let tag;
    try { tag = await rpc("tasma_tag_lookup", {p_code: code}); }
    catch (e) { return showMessage("Bağlantı hatası", "Sayfayı yenileyip tekrar deneyin."); }
    if (!tag?.exists) return showMessage("Rozet bulunamadı", "Bu QR kod geçerli bir rozete ait değil.");
    if (params.has("duzenle") || !tag.phone) return showEdit(code, tag);
    return showFound(code, tag);
  }

  const [page = "", arg, extra] = location.hash.slice(1).split("/").map(decodeURIComponent);
  // sayfa → çerçeve (sitede menü, uygulamada üst bar ve sekmeler)
  const sub = (title, nav = null) => APP ? setChrome({kind: "app", title, back: true}) : setChrome({kind: "site", nav, title});
  if (page === "olustur") { sub("Rozet oluştur"); return showCreate(); }
  if (page === "kunye" && arg) { sub("Rozetim", "kunyelerim"); return showTagPage(arg, extra === "yeni"); }
  if (page === "siparis" && arg) { sub("Rozet siparişi", "kunyelerim"); return showOrderForm(arg); }
  if (page === "odeme" && arg) { sub("Sipariş", "kunyelerim"); return showPay(arg); }
  if (page === "duzenle" && arg) { // uygulamada: ?k=KOD&duzenle yerine
    sub("Bilgileri düzenle");
    let tag;
    try { tag = await rpc("tasma_tag_lookup", {p_code: arg}); } catch (e) { return showMessage("Bağlantı hatası", "İnternetinizi kontrol edip tekrar deneyin."); }
    return tag?.exists ? showEdit(arg, tag) : showMessage("Rozet bulunamadı", "Bu rozet silinmiş olabilir.");
  }
  if (APP) {
    if (page === "siparislerim") { setChrome({kind: "app", tab: "orders", title: "Siparişlerim"}); return showMyOrders(); }
    if (page === "profil") { setChrome({kind: "app", tab: "profile", title: "Profilim"}); return showProfile(); }
    // sitedeki sayfalar uygulamada sekme (Ana sayfa, Rozetler) ya da geri tuşlu alt sayfa (Nasıl çalışır, SSS, Hazır rozet)
    if (page === "urunler") { setChrome({kind: "app", tab: "shop", title: "Rozetler"}); return showProducts(); }
    if (page === "nasil") { sub("Nasıl çalışır"); return showHow(); }
    if (page === "sss") { sub("Sık sorulanlar"); return showFaq(); }
    if (page === "talep") { sub("Hazır rozet"); return showRequest(); }
    if (page === "kunyelerim") { setChrome({kind: "app", tab: "tags", title: "Rozetlerim"}); return showMine("", arg === "ekle"); }
    setChrome({kind: "app", tab: "home", title: "Tasma QR"});  // ilk girişte tanıtım showHome içinde açılır
    return showHome();
  }
  const pages = {"": [showHome, "Tasma QR"], nasil: [showHow, "Nasıl çalışır"], urunler: [showProducts, "Rozetler"], talep: [showRequest, "Hazır rozet"],
    sss: [showFaq, "Sık sorulanlar"], kunyelerim: [() => showMine("", arg === "ekle"), "Rozetlerim"]};
  const [fn, title] = pages[page] || pages[""];
  setChrome({kind: "site", nav: pages[page] ? page : "", title});
  fn();
}

addEventListener("hashchange", () => { if (!params.has("k") && !params.has("admin")) route(); });
syncNative();
route();
</script>
