<body>
<main id="app"><p>Yükleniyor…</p></main>

<script>
const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
const BASE = location.origin + location.pathname;
// Yerelde denerken de basılan QR'lar gerçek siteyi açsın
const SITE = /^https?:$/.test(location.protocol) && !/^(localhost|127\.|0\.0\.0\.0|\[::1\])/.test(location.hostname) ? BASE : SITE_URL;
const tagLink = code => `${SITE}?k=${encodeURIComponent(code)}`;

// ---------------------------------------------------------------- yardımcılar
async function rpc(fn, args = {}) {
  const headers = {"Content-Type": "application/json", apikey: SUPABASE_KEY};
  if (SUPABASE_KEY.startsWith("eyJ")) headers.Authorization = "Bearer " + SUPABASE_KEY; // eski tip anon key
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {method: "POST", headers, body: JSON.stringify(args)});
  const data = await r.json().catch(() => null);
  if (!r.ok) { const e = new Error(data?.message || r.statusText); e.status = r.status; throw e; }
  return data;
}

function normalizePhone(raw) {
  let s = String(raw || "").replace(/[^\d+]/g, "");
  if (s.startsWith("00")) s = "+" + s.slice(2);
  if (s.startsWith("+")) return (s.length - 1 >= 10 && s.length - 1 <= 15) ? s : null;
  if (s.startsWith("90") && s.length === 12) return "+" + s;
  if (s.startsWith("0") && s.length === 11) return "+9" + s;
  if (s.startsWith("5") && s.length === 10) return "+90" + s;
  return null;
}

function prettyPhone(p) {
  if (p && p.startsWith("+90") && p.length === 13) {
    const n = p.slice(3);
    return `0${n.slice(0,3)} ${n.slice(3,6)} ${n.slice(6,8)} ${n.slice(8)}`;
  }
  return p || "";
}

const digits = p => String(p || "").replace(/\D/g, "");
const waHref = (phone, text) => `https://wa.me/${digits(phone)}?text=${encodeURIComponent(text)}`;
const smsHref = (phone, text) => `sms:${phone}?body=${encodeURIComponent(text)}`;
const dateTR = t => t ? new Date(t).toLocaleString("tr-TR", {dateStyle: "medium", timeStyle: "short"}) : "";

function ago(t) {
  const m = Math.round((Date.now() - new Date(t)) / 60000);
  if (m < 1) return "az önce";
  if (m < 60) return `${m} dakika önce`;
  if (m < 60 * 24) return `${Math.round(m / 60)} saat önce`;
  return `${Math.round(m / 1440)} gün önce`;
}

function show(html, cls = "") { app.className = cls === true ? "wide" : cls; app.innerHTML = html; scrollTo(0, 0); }

const petBadge = (name, code, lost) => `<div class="pet${lost ? " is-lost" : ""}"><div class="ic">${icon("paw", "#fff")}</div>
  <div class="nm">${name ? esc(upTR(name)) : "TASMA QR"}</div><small>${esc(code)}</small></div>`;

function showMessage(title, text) {
  show(`<h1>${esc(title)}</h1><p>${esc(text)}</p><a class="btn ghost" href="${esc(BASE)}">Ana sayfa</a>`);
}

// ---------------------------------------------------------------- bu cihazdaki künyeler ve siparişler
const store = {
  get(key, fallback) { try { const v = localStorage.getItem("tasmaqr-" + key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } },
  set(key, value) { try { localStorage.setItem("tasmaqr-" + key, JSON.stringify(value)); } catch (e) {} },
};
const myTags = () => store.get("tags", []);
const findTag = code => myTags().find(t => t.code === code);
function saveTag(tag) {
  const old = findTag(tag.code) || {design: "klasik", size: "y35", copies: 1, created: Date.now()};
  store.set("tags", [{...old, ...tag}, ...myTags().filter(t => t.code !== tag.code)]);
}
const removeTag = code => store.set("tags", myTags().filter(t => t.code !== code));
const myOrders = () => store.get("orders", []);
function saveOrder(o) { store.set("orders", [{...myOrders().find(x => x.code === o.code), ...o}, ...myOrders().filter(x => x.code !== o.code)]); }
function deviceId() {
  let id = store.get("device", null);
  if (!id) { id = crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now(); store.set("device", id); }
  return id;
}

// ---------------------------------------------------------------- eğlence
function toast(text, ms = 3200) {
  document.querySelector(".toast")?.remove();
  const t = Object.assign(document.createElement("div"), {className: "toast noprint", textContent: text});
  t.setAttribute("role", "status");
  document.body.append(t);
  setTimeout(() => t.remove(), ms);
}

function confetti() {
  const colors = ["#b8501a", "#ffd400", "#0c7a43", "#e05a8a", "#163a7a", "#c98b4f"];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement("div");
    c.className = "confetti noprint";
    c.style.cssText = `left:${Math.random() * 100}vw;background:${colors[i % colors.length]};` +
      `animation-duration:${1.6 + Math.random() * 1.6}s;animation-delay:${Math.random() * .4}s;border-radius:${i % 3 ? 2 : 50}px`;
    document.body.append(c);
    setTimeout(() => c.remove(), 3800);
  }
}

// ---------------------------------------------------------------- bulan kişi: QR okutulunca
function showFound(code, tag) {
  const name = tag.pet_name || "", phone = tag.phone;
  const hello = `Merhaba, ${name ? `${name} adlı köpeğinizi` : "köpeğinizi"} buldum (Tasma QR).`;
  const since = tag.lost_since ? ` (${ago(tag.lost_since)} kayıp olarak işaretlendi)` : "";
  const backup = tag.backup_phone ? `
    <div class="msg info" style="margin-top:18px">Ulaşamazsanız${tag.backup_name ? ` <b>${esc(tag.backup_name)}</b>` : ""}:
      <a href="tel:${esc(tag.backup_phone)}"><b>${esc(prettyPhone(tag.backup_phone))}</b></a></div>
    <a class="btn ghost" href="tel:${esc(tag.backup_phone)}" style="margin-top:8px">Yedek numarayı ara</a>` : "";
  show(`
    ${petBadge(name, code, tag.lost)}
    ${tag.lost ? `<div class="lost" role="alert"><b>🚨 ${name ? esc(upTR(name)) : "BU KÖPEK"} KAYIP!</b>Sahibi onu arıyor${esc(since)}.
      Lütfen hemen arayın ve mümkünse köpeği güvenli bir yerde tutun.${tag.reward ? `<span class="reward">Ödül: ${esc(tag.reward)}</span>` : ""}</div>` : ""}
    <h1>${name ? `Merhaba, ben ${esc(name)}! 🐾` : "Merhaba, beni buldun! 🐾"}</h1>
    <p>Sahibime ulaşmama yardım eder misin? Aşağıdan arayabilir ya da bulunduğun yeri tek dokunuşla gönderebilirsin.</p>
    ${tag.notes ? `<div class="msg info"><b>Sahibimin notu:</b> ${esc(tag.notes)}</div>` : ""}
    <a class="btn call" href="tel:${esc(phone)}">📞 Sahibimi ara</a>
    <button class="btn loc" type="button" id="loc">📍 Konumumu sahibine gönder</button>
    <div id="locbox"></div>
    <a class="btn ghost" href="${esc(waHref(phone, hello))}">💬 WhatsApp'tan yaz</a>
    <a class="btn ghost" href="${esc(smsHref(phone, hello))}">✉️ SMS gönder</a>
    ${backup}
    <p class="small"><a href="${esc(tagLink(code))}&duzenle">Köpeğin sahibi misiniz? Bilgileri düzenleyin</a></p>`);
  const btn = document.getElementById("loc"), box = document.getElementById("locbox");
  const sendButtons = text => `<a class="btn" href="${esc(waHref(phone, text))}">WhatsApp'tan gönder</a>
    <a class="btn ghost" href="${esc(smsHref(phone, text))}">SMS ile gönder</a>`;
  btn.onclick = () => {
    const fail = why => {
      btn.disabled = false; btn.textContent = "📍 Tekrar dene";
      box.innerHTML = `<div class="msg err" style="margin-top:14px">${esc(why)} Yine de mesajla nerede olduğunuzu yazabilirsiniz.</div>`;
    };
    if (!navigator.geolocation) return fail("Tarayıcınız konum paylaşımını desteklemiyor.");
    btn.disabled = true; btn.textContent = "Konum alınıyor…";
    navigator.geolocation.getCurrentPosition(async pos => {
      const {latitude: lat, longitude: lng, accuracy} = pos.coords;
      const text = `${hello} Şu an buradayız: https://maps.google.com/?q=${lat.toFixed(6)},${lng.toFixed(6)}`;
      let saved = false;
      try { saved = !!(await rpc("tasma_report_location", {p_code: code, p_lat: lat, p_lng: lng, p_accuracy: Math.round(accuracy || 0)}))?.ok; }
      catch (e) {}
      btn.remove();
      box.innerHTML = `<div class="msg ok" style="margin-top:14px"><b>Teşekkürler!</b> Konumunuz alındı${saved ? " ve sahibinin künye sayfasına kaydedildi" : ""}.
        Sahibine hemen haber vermek için mesajla da gönderin:</div>${sendButtons(text)}`;
      confetti();
    }, err => fail(err.code === 1 ? "Konum izni verilmedi." : "Konum alınamadı."),
    {enableHighAccuracy: true, timeout: 15000, maximumAge: 60000});
  };
}

// ---------------------------------------------------------------- PDF
function loadScript(src) {
  return new Promise((ok, fail) => {
    if (document.querySelector(`script[src="${src}"]`)) return ok();
    const el = Object.assign(document.createElement("script"), {src, onload: ok, onerror: () => fail(new Error("Kütüphane yüklenemedi"))});
    document.head.append(el);
  });
}

async function loadPdfLibs() {
  await Promise.all([
    loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),
    loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"),
  ]);
  await document.fonts?.ready;
}

const PX = 25.4 / 96; // CSS px -> mm

async function snap(el) {
  const r = el.getBoundingClientRect();
  const canvas = await html2canvas(el, {scale: 6, backgroundColor: "#ffffff", logging: false});
  return {img: canvas.toDataURL("image/png"), w: r.width * PX, h: r.height * PX};
}

// Görüntüleri A4'e gerçek boyutlarıyla dizer
function layoutA4(pdf, shots) {
  const {W, H, M, G} = A4;
  let x = M, y = M, rowH = 0, first = true;
  for (const s of shots) {
    if (x + s.w > W - M + .1) { x = M; y += rowH + G; rowH = 0; }
    if (y + s.h > H - M + .1) { pdf.addPage(); x = M; y = M; rowH = 0; }
    pdf.addImage(s.img, "PNG", x, y, s.w, s.h, undefined, "FAST");
    x += s.w + G; rowH = Math.max(rowH, s.h); first = false;
  }
  return !first;
}

function downloadBlob(blob, name) {

function bindRequestForm() {
  document.getElementById("rf").addEventListener("submit", async ev => {
    ev.preventDefault();
    const g = id => document.getElementById(id);
    const v = {first: g("r-first").value.trim(), last: g("r-last").value.trim(), email: g("r-email").value.trim(),
      phone: g("r-phone").value.trim(), pet: g("r-pet").value.trim(), note: g("r-note").value.trim(), ok: g("r-ok").checked};
    const box = g("formbox");
    const fail = msg => { box.innerHTML = requestFormHtml(msg, v); bindRequestForm(); box.querySelector(".msg").scrollIntoView({block: "center"}); };
    if (!v.first || !v.last) return fail("Ad ve soyadınızı yazın.");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email)) return fail("E-posta adresi geçersiz. Örnek: ornek@mail.com");
    const phone = v.phone ? normalizePhone(v.phone) : null;
    if (v.phone && !phone) return fail("Telefon numarası geçersiz (örnek: 0532 123 45 67). İstemiyorsanız boş bırakabilirsiniz.");
    if (!v.ok) return fail("Devam etmek için bilgilendirme onayını işaretleyin.");
    const done = () => {
      box.innerHTML = `<div class="msg ok" role="status"><b>Talebiniz alındı, teşekkürler ${esc(v.first)}!</b><br>${phone ? `Künyenizi ${esc(prettyPhone(phone))} numarasına WhatsApp'tan göndereceğiz.` : `En kısa sürede ${esc(v.email)} adresinden size ulaşacağız.`}</div>`;
      confetti();
    };
    if (g("r-web").value) return done(); // bot tuzağı: sessizce geç
    ev.submitter && (ev.submitter.disabled = true);
    try {
      const res = await rpc("tasma_request_create", {p_first_name: v.first, p_last_name: v.last, p_email: v.email, p_phone: phone,
        p_pet_name: v.pet || null, p_note: v.note || null});
      if (res?.ok) return done();
      fail({missing: "Ad ve soyadınızı yazın.", bad_email: "E-posta adresi geçersiz.", bad_phone: "Telefon numarası geçersiz.",
        too_many: "Bugün bu bilgilerle zaten talep gönderdiniz; sizinle iletişime geçeceğiz.",
        busy: "Şu an çok yoğunuz, birkaç dakika sonra tekrar deneyin."}[res?.error] || "Talep gönderilemedi, tekrar deneyin.");
    } catch (e) {
      fail("Bağlantı hatası. İnternetinizi kontrol edip tekrar deneyin.");
    }
  });
}

    if (!res?.ok) {

        too_many: "Bugün çok fazla künye oluşturdunuz. Yarın tekrar deneyin ya da Künyelerim'deki künyeyi kullanın.",
        busy: "Şu an çok yoğun, birkaç dakika sonra tekrar deneyin."}[res?.error] || "Künye oluşturulamadı, tekrar deneyin.", v);
    }
    store.set("lastPhone", v.phone); store.set("lastDesign", v.design);
    saveTag({code: res.code, pin: res.pin, name: v.name, phone, design: v.design, created: Date.now()});
    location.replace(`#kunye/${encodeURIComponent(res.code)}/yeni`);
  });
}

// ---------------------------------------------------------------- sahibi: künyelerim
const loadStats = async tags => {
  if (!tags.length) return {};
  try {
    const rows = await rpc("tasma_tag_stats", {p_codes: tags.map(t => t.code), p_pins: tags.map(t => t.pin)});
    const map = Object.fromEntries((rows || []).map(r => [r.code, r]));
    // sunucudaki güncel ad ve numarayı yerelde de güncelle
    tags.forEach(t => { const r = map[t.code]; if (r && (r.pet_name !== t.name || r.phone !== t.phone)) saveTag({code: t.code, name: r.pet_name, phone: r.phone}); });
    return map;
  } catch (e) { return {}; }
};

const statLine = st => !st ? "" : `${st.lost ? `<span class="tagchip red">KAYIP</span>` : ""}👀 ${st.last30} okutma / 30 gün` +
  (st.sightings?.length ? ` · 📍 son konum ${ago(st.sightings[0].at)}` : "");

const ORDER_STATUS = {
  odeme_bekleniyor: "Ödeme bekleniyor", odeme_bildirildi: "Ödeme yapıldı, kontrol edilecek",
  onaylandi: "Onaylandı, baskıya gönderilecek", baskida: "Baskıda", kargolandi: "Kargolandı", iptal: "İptal",
};

function showMine(error = "") {
  const list = myTags(), orders = myOrders();
  show(`
    ${backLink("#", "Ana sayfa")}
    <h1>Künyelerim</h1>
    <p>Bu cihazda oluşturduğunuz ya da eklediğiniz künyeler. Tarayıcı verilerini silerseniz liste de silinir; PIN'lerinizi bir yere not edin.</p>
    ${list.length ? `<div class="cards">${list.map(t => `
      <a class="mine" href="#kunye/${encodeURIComponent(t.code)}" data-code="${esc(t.code)}">
        ${tagAt(t.code, t.design, "y25", {name: t.name})}
        <div><b>${esc(t.name || t.code)}</b>
          <span>${esc(t.code)} · ${esc(prettyPhone(t.phone))}<br><span data-stat>…</span></span></div>
      </a>`).join("")}</div>` : `<div class="msg info">Henüz künyeniz yok.</div>`}
    <a class="btn" href="#olustur">+ Yeni künye oluştur</a>
    <details style="margin-top:14px"${error ? " open" : ""}><summary>Elimdeki künyeyi ekle (kod ve PIN ile)</summary>
      ${error ? `<div class="msg err" style="margin-top:10px">${esc(error)}</div>` : ""}
      <form id="addf" novalidate>
        <div class="row2">
          <div><label for="a-code">Künye kodu</label><input id="a-code" autocomplete="off" placeholder="ör. K7F3A9C2" style="text-transform:uppercase"></div>
          <div><label for="a-pin">PIN</label><input id="a-pin" inputmode="numeric" maxlength="6" autocomplete="off"></div>
        </div>
        <button class="btn ghost" type="submit">Ekle</button>
      </form>
    </details>
    ${orders.length ? `<h2>Siparişlerim</h2><div class="cards">${orders.map(o => `
      <a class="mine" href="#odeme/${encodeURIComponent(o.code)}" style="grid-template-columns:1fr">
        <div><b>${esc(o.code)} · ${esc(o.amount)} TL</b>
          <span data-order="${esc(o.code)}">${esc(ORDER_STATUS[o.status] || o.status)}${o.tracking ? ` · Takip no: ${esc(o.tracking)}` : ""}</span></div>
      </a>`).join("")}</div>` : ""}`, "mid");
  document.getElementById("addf").addEventListener("submit", async ev => {
    ev.preventDefault();
    const code = document.getElementById("a-code").value.trim().toUpperCase(), pin = document.getElementById("a-pin").value.trim();
    if (!code || !/^\d{6}$/.test(pin)) return showMine("Künye kodunu ve 6 haneli PIN'i girin.");
    let rows;
    try { rows = await rpc("tasma_tag_stats", {p_codes: [code], p_pins: [pin]}); }
    catch (e) { return showMine("Bağlantı hatası, tekrar deneyin."); }
    const r = rows?.[0];
    if (!r) return showMine("Kod ya da PIN hatalı.");
    if (!r.phone) { location.href = `${tagLink(code)}&duzenle`; return; } // henüz bağlanmamış: önce bağlasın
    saveTag({code, pin, name: r.pet_name, phone: r.phone});
    location.hash = `#kunye/${encodeURIComponent(code)}`;

  loadStats(list).then(st => document.querySelectorAll(".mine[data-code]").forEach(el => {

    el.classList.toggle("is-lost", !!s?.lost);

  refreshOrders().then(() => myOrders().forEach(o => {

    if (el) el.textContent = (ORDER_STATUS[o.status] || o.status) + (o.tracking ? ` · Takip no: ${o.tracking}` : "");
  }));
}

async function refreshOrders() {
  const list = myOrders();
  if (!list.length) return;
  try {
    const rows = await rpc("tasma_order_status", {p_codes: list.map(o => o.code), p_tokens: list.map(o => o.token)});
    (rows || []).forEach(r => saveOrder({code: r.code, status: r.status, tracking: r.tracking}));
  } catch (e) {}
}

// ---------------------------------------------------------------- sahibi: tek künye (yazdır, PDF, kayıp modu, konumlar)
function showTagPage(code, fresh) {
  const t = findTag(code);
  if (!t) {
    return show(`${backLink("#kunyelerim", "Künyelerim")}<h1>Künye bu cihazda kayıtlı değil</h1>
      <p>Künyeyi Künyelerim'den kodu ve PIN'i ile ekleyebilirsiniz.</p><a class="btn" href="#kunyelerim">Künyelerim</a>`);
  }
  const {w, h} = dims(t.size), fit = perA4({w, h});
  const copies = Math.min(t.copies || 1, fit);
  const copyOpts = [...new Set([1, 2, 4, 6, 10, fit].filter(n => n <= fit))];
  show(`
    <div class="noprint">
      ${backLink("#kunyelerim", "Künyelerim")}
      ${petBadge(t.name, t.code)}
      ${fresh ? `<div class="msg ok"><b>Künyeniz hazır!</b> Aşağıdaki PIN'i bir yere not edin: bilgileri değiştirmek ve kayıp modunu açmak için gerekir.</div>` : ""}
      <div class="card">
        <div id="lostbox"></div>
        <dl class="kv">
          <dt>PIN</dt><dd><b id="pinv">${fresh ? esc(t.pin) : "••••••"}</b> ${fresh ? "" : `<button class="chip" type="button" id="pinshow">Göster</button>`}</dd>
          <dt>Aranacak</dt><dd>${esc(prettyPhone(t.phone))}</dd>
          <dt>QR adresi</dt><dd><a href="${esc(tagLink(t.code))}" style="color:var(--band)">${esc(tagLink(t.code))}</a></dd>
          <dt>Okutma</dt><dd id="scans">…</dd>
        </dl>
        <div id="sightings"></div>
        <a class="btn ghost" href="${esc(tagLink(t.code))}&duzenle">Bilgileri düzenle (ad, numara, not, ödül)</a>
      </div>

      <div class="card">
        <h2>Yazdır</h2>
        <div class="bar">
          <select id="size" aria-label="Ölçü">${Object.entries(SIZES).map(([k, n]) => `<option value="${k}"${k === t.size ? " selected" : ""}>${esc(n)}</option>`).join("")}</select>
          <select id="copies" aria-label="Adet">${copyOpts.map(n => `<option value="${n}"${n === copies ? " selected" : ""}>${n === fit ? `A4 dolusu (${n} adet)` : `${n} adet`}</option>`).join("")}</select>
        </div>
        ${designChips(t.design)}
        <div class="bar" style="margin:16px 0 0">
          <button class="btn" type="button" id="print">Yazdır</button>
          <button class="btn alt" type="button" id="pdf">PDF indir</button>
        </div>
        <span class="hint">Yazdırırken ölçek <b>%100 / Gerçek boyut</b> olmalı. Künyeyi kesip yapıştırın, üzerini şeffaf bant ya da laminasyonla kaplayın.</span>
      </div>
      <div id="shopbox"></div>
    </div>
    <div class="printgrid" id="pg" style="${sizeVars(t.size)}">${Array.from({length: copies}, () => tagHtml(t.code, t.design, {name: t.name, round: dims(t.size).round})).join("")}</div>
    <div class="noprint">
      <p class="small"><a href="#" id="forget">Bu künyeyi bu cihazdan kaldır</a></p>
    </div>`, "mid");
  if (fresh) confetti();
  const g = id => document.getElementById(id);
  const pageStyle = () => {
    let st = g("pagestyle");
    if (!st) { st = Object.assign(document.createElement("style"), {id: "pagestyle"}); document.head.append(st); }
    st.textContent = `@page{size:A4;margin:${A4.M}mm}`;
  };
  const rerender = patch => { saveTag({code, ...patch}); showTagPage(code, fresh); };
  g("pinshow")?.addEventListener("click", ev => { g("pinv").textContent = t.pin; ev.target.remove(); });
  g("size").onchange = () => rerender({size: g("size").value});
  g("copies").onchange = () => rerender({copies: Number(g("copies").value)});
  document.querySelector(".designs").onclick = ev => { const b = ev.target.closest("[data-d]"); if (b) rerender({design: b.dataset.d}); };
  g("print").onclick = () => { pageStyle(); print(); };
  g("pdf").onclick = async ev => {
    ev.target.disabled = true;
    toast("PDF hazırlanıyor…", 60000);
    try {
      await loadPdfLibs();
      const s = await snap(document.querySelector("#pg .sticker"));
      const pdf = new window.jspdf.jsPDF({unit: "mm", format: "a4"});
      layoutA4(pdf, Array.from({length: copies}, () => s));
      pdf.save(`kunye-${t.code}-${t.size}.pdf`);
      toast("PDF indirildi.");
    } catch (e) { toast("PDF oluşturulamadı: " + e.message, 5000); }
    ev.target.disabled = false;
  };
  g("forget").onclick = ev => {
    ev.preventDefault();
    if (!confirm(`${t.name || t.code} künyesi bu cihazdan kaldırılsın mı? Künye çalışmaya devam eder; PIN'iniz yoksa bir daha ekleyemezsiniz.\n\nPIN: ${t.pin}`)) return;
    removeTag(code); location.hash = "#kunyelerim";
  };
  // sunucudan güncel durum: kayıp modu, okutmalar, konumlar
  loadStats([t]).then(st => {
    const s = st[code];
    if (!s) { g("scans").textContent = "alınamadı"; return; }
    g("scans").textContent = s.total ? `${s.total} kez (son 30 günde ${s.last30}) · son: ${ago(s.last)}` : "Henüz okutulmadı";
    g("sightings").innerHTML = s.sightings.length ? `<h2>📍 Bulan kişilerin gönderdiği konumlar</h2><ol class="sight">${s.sightings.map(x =>
      `<li><a href="https://maps.google.com/?q=${x.lat},${x.lng}" target="_blank" rel="noopener">${esc(dateTR(x.at))}</a> · ${esc(ago(x.at))}${x.accuracy ? ` · ±${esc(x.accuracy)} m` : ""}</li>`).join("")}</ol>` : "";
    const lostHtml = () => s.lost
      ? `<div class="lost"><b>🚨 Kayıp modu açık</b>QR'ı okutan kişi kırmızı uyarıyı görüyor.<button class="btn ghost" type="button" id="lostbtn">${esc(t.name || "Köpeğim")} bulundu, kayıp modunu kapat</button></div>`
      : `<button class="btn danger" type="button" id="lostbtn" style="margin:0 0 16px">🚨 Köpeğim kayboldu: kayıp modunu aç</button>`;
    g("lostbox").innerHTML = lostHtml();
    g("lostbox").onclick = async ev => {
      if (ev.target.id !== "lostbtn") return;
      const on = !s.lost;
      if (on && !confirm("Kayıp modu açılsın mı? QR'ı okutan kişi kırmızı “KAYIP” uyarısını görecek.")) return;
      ev.target.disabled = true;
      try {
        const r = await rpc("tasma_tag_set_lost", {p_code: code, p_pin: t.pin, p_lost: on});
        if (!r?.ok) throw new Error(r?.error === "bad_pin" ? "PIN hatalı" : r?.error === "locked" ? "çok fazla deneme, biraz bekleyin" : "kaydedilemedi");
        s.lost = on; g("lostbox").innerHTML = lostHtml();
        if (on) toast("Kayıp modu açıldı. Umarız çabucak kavuşursunuz.", 5000); else { confetti(); toast("Ne güzel! Kayıp modu kapatıldı."); }
      } catch (e) { ev.target.disabled = false; toast("İşlem yapılamadı: " + e.message, 5000); }
    };
  });
  // basılı künye satışı açıksa sipariş kartı
  rpc("tasma_shop_info").then(shop => {
    if (!shop?.active) return;
    g("shopbox").innerHTML = `<div class="card"><h2>Basılı künye sipariş edin · ${esc(shop.price)} TL</h2>
      <p>${esc(shop.product_text)} ${esc(shop.shipping_text)}</p>
      <a class="btn alt" href="#siparis/${encodeURIComponent(code)}">Sipariş ver</a></div>`;
  }, () => {});
}

// ---------------------------------------------------------------- sahibi: basılı künye siparişi (IBAN ile ödeme)
async function showOrderForm(code, error = "", v = null) {
  const t = findTag(code);
  if (!t) return showTagPage(code);
  let shop;
  try { shop = await rpc("tasma_shop_info"); } catch (e) { return showMessage("Bağlantı hatası", "Sayfayı yenileyip tekrar deneyin."); }
  if (!shop?.active) return showMessage("Şu an sipariş alınmıyor", "Künyenizi kendiniz yazdırabilirsiniz. Satış açıldığında burada görünecek.");
  v ||= {...store.get("address", {}), phone: store.get("address", {}).phone || prettyPhone(t.phone), design: t.design};
  const val = k => `value="${esc(v[k] || "")}"`;
  show(`
    ${backLink(`#kunye/${encodeURIComponent(code)}`, "Künyeye dön")}
    <h1>Basılı künye siparişi</h1>
    <p>${esc(shop.product_text)} <b>${esc(shop.price)} TL</b>. ${esc(shop.shipping_text)}</p>
    <div class="preview">${tagAt(code, v.design, "y35", {name: t.name})}${tagAt(code, v.design, "k35x50", {name: t.name})}</div>
    ${error ? `<div class="msg err" role="alert" style="margin-top:14px">${esc(error)}</div>` : ""}
    <form id="of" novalidate>
      <label>Tasarım</label>
      ${designChips(v.design)}
      <label for="o-name">Ad soyad</label><input id="o-name" autocomplete="name" ${val("name")}>
      <label for="o-phone">Telefon</label><input id="o-phone" type="tel" inputmode="tel" autocomplete="tel" ${val("phone")}>
      <label for="o-email">E-posta <span class="opt">(isteğe bağlı)</span></label><input id="o-email" type="email" autocomplete="email" ${val("email")}>
      <div class="row2">
        <div><label for="o-city">İl</label><input id="o-city" autocomplete="address-level1" ${val("city")}></div>
        <div><label for="o-district">İlçe</label><input id="o-district" autocomplete="address-level2" ${val("district")}></div>
      </div>
      <label for="o-address">Açık adres</label><textarea id="o-address" rows="3" maxlength="400" autocomplete="street-address">${esc(v.address || "")}</textarea>
      <label for="o-note">Not <span class="opt">(isteğe bağlı)</span></label><input id="o-note" maxlength="300" ${val("note")}>
      <button class="btn" type="submit">Siparişi oluştur · ${esc(shop.price)} TL</button>
      <span class="hint">Sonraki adımda havale / EFT bilgilerini göreceksiniz.</span>
    </form>`, "mid");
  const form = document.getElementById("of"), g = id => document.getElementById(id).value.trim();
  const read = () => ({design: v.design, name: g("o-name"), phone: g("o-phone"), email: g("o-email"), city: g("o-city"),
    district: g("o-district"), address: g("o-address"), note: g("o-note")});
  form.querySelector(".designs").onclick = ev => { const b = ev.target.closest("[data-d]"); if (b) showOrderForm(code, "", {...read(), design: b.dataset.d}); };
  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    const nv = read(), phone = normalizePhone(nv.phone);
    if (nv.name.length < 3) return showOrderForm(code, "Ad soyad yazın.", nv);
    if (!phone) return showOrderForm(code, "Telefon geçersiz. Örnek: 0532 123 45 67", nv);
    if (nv.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(nv.email)) return showOrderForm(code, "E-posta geçersiz.", nv);
    if (!nv.city || !nv.district || nv.address.length < 10) return showOrderForm(code, "İl, ilçe ve açık adresi eksiksiz yazın.", nv);
    ev.submitter && (ev.submitter.disabled = true);
    let res;
    try {
      res = await rpc("tasma_order_create", {p_tag_code: code, p_design: nv.design, p_full_name: nv.name, p_phone: phone, p_email: nv.email || null,
        p_city: nv.city, p_district: nv.district, p_address: nv.address, p_note: nv.note || null, p_device: deviceId()});
    } catch (e) { return showOrderForm(code, "Bağlantı hatası, tekrar deneyin.", nv); }
    if (!res?.ok) {
      return showOrderForm(code, {closed: "Şu an sipariş alınmıyor.", no_tag: "Bu künye bulunamadı.", missing: "Bilgiler eksik.",
        bad_phone: "Telefon geçersiz.", bad_email: "E-posta geçersiz.", too_many: "Bugün çok fazla sipariş verdiniz.",
        busy: "Şu an çok yoğun, biraz sonra deneyin."}[res?.error] || "Sipariş oluşturulamadı.", nv);
    }
    store.set("address", {name: nv.name, phone: nv.phone, email: nv.email, city: nv.city, district: nv.district, address: nv.address});
    saveTag({code, design: nv.design});
    saveOrder({code: res.code, token: res.token, amount: res.amount, status: res.status, tag: code, created: Date.now()});
    location.replace(`#odeme/${encodeURIComponent(res.code)}`);
  });
}

async function showPay(orderCode) {
  await refreshOrders();
  const o = myOrders().find(x => x.code === orderCode);
  if (!o) return showMessage("Sipariş bulunamadı", "Bu sipariş bu cihazda kayıtlı değil.");
  let shop = null;
  try { shop = await rpc("tasma_shop_info"); } catch (e) {}
  const waiting = o.status === "odeme_bekleniyor";
  const iban = (shop?.iban || "").replace(/(.{4})/g, "$1 ").trim();
  show(`
    ${backLink("#kunyelerim", "Künyelerim")}
    <h1>Sipariş ${esc(o.code)}</h1>
    <div class="msg ${o.status === "iptal" ? "err" : "info"}"><b>Durum:</b> ${esc(ORDER_STATUS[o.status] || o.status)}${o.tracking ? `<br><b>Kargo takip no:</b> ${esc(o.tracking)}` : ""}</div>
    ${waiting && shop ? `
      <div class="card">
        <h2>${esc(o.amount)} TL'yi havale / EFT ile gönderin</h2>
        <dl class="kv">
          <dt>IBAN</dt><dd><b>${esc(iban)}</b> <button class="chip" type="button" id="copy">Kopyala</button></dd>
          <dt>Alıcı</dt><dd>${esc(shop.account_name)}</dd>
          ${shop.bank_name ? `<dt>Banka</dt><dd>${esc(shop.bank_name)}</dd>` : ""}
          <dt>Açıklama</dt><dd><b>${esc(o.code)}</b></dd>
        </dl>
        <p style="margin-top:12px">Açıklamaya sipariş numarasını yazmayı unutmayın. Ödemeyi yaptıktan sonra aşağıdaki butona basın.</p>
        <button class="btn" type="button" id="paid">Ödemeyi yaptım</button>
      </div>` : ""}
    ${o.status === "odeme_bildirildi" ? `<p>Teşekkürler! Ödemeniz kontrol edildikten sonra künyeleriniz baskıya alınacak. Durumu buradan ve Künyelerim'den takip edebilirsiniz.</p>` : ""}`, "mid");
  document.getElementById("copy")?.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(shop.iban); toast("IBAN kopyalandı."); } catch (e) { toast("Kopyalanamadı; IBAN'ı uzun basıp seçin."); }
  });
  document.getElementById("paid")?.addEventListener("click", async ev => {
    ev.target.disabled = true;
    try {
      const r = await rpc("tasma_order_paid", {p_code: o.code, p_token: o.token});
      if (!r?.ok) throw new Error();
      saveOrder({code: o.code, status: r.status});
      await showPay(orderCode);
      confetti();
    } catch (e) { ev.target.disabled = false; toast("Bildirilemedi, tekrar deneyin."); }
  });
}

// ---------------------------------------------------------------- kurulum yardımı

const SUPABASE_REF = new URL(SUPABASE_URL).hostname.split(".")[0];
const SQL_EDITOR = `https://supabase.com/dashboard/project/${SUPABASE_REF}/sql/new`;

function setupHtml(text) {
  return `<div class="msg err noprint setup">${esc(text)} Bu site <b>${esc(SUPABASE_REF)}</b> kodlu Supabase projesine bağlı; SQL'i bu projede çalıştırdığınızdan emin olun
    (farklı projedeyse index.html'in başındaki SUPABASE_URL ve SUPABASE_KEY'i o projeninkiyle değiştirin). Kurmak için: <b>1.</b> SQL'i kopyalayın, <b>2.</b> Supabase SQL Editor'ı açın,
    <b>3.</b> yapıştırın, en üstteki <b>v_sifre</b> satırına admin şifrenizi yazın ve <b>Run</b>'a basın, <b>4.</b> bu sayfayı yenileyin.
    <div class="bar" style="margin:10px 0 0">
      <button class="btn" type="button" data-sql="supabase/kurulum.sql">1. SQL'i kopyala</button>
      <a class="btn" href="${esc(SQL_EDITOR)}" target="_blank" rel="noopener">2. SQL Editor'ı aç</a>
    </div></div>`;
}

document.addEventListener("click", async ev => {
  const btn = ev.target.closest("button[data-sql]");
  if (!btn) return;
  const box = btn.closest(".setup");
  let sql;
  try {
    const r = await fetch(btn.dataset.sql, {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    sql = await r.text();
  } catch (e) {
    const url = `https://raw.githubusercontent.com/yusufbas34/tasmaqr/main/${btn.dataset.sql}`;
    return box.insertAdjacentHTML("beforeend", `<p style="margin:10px 0 0">SQL yüklenemedi. <a href="${esc(url)}" target="_blank" rel="noopener">Buradan açıp</a> tümünü seçerek kopyalayın.</p>`);
  }
  try {
    await navigator.clipboard.writeText(sql);
    btn.textContent = "✓ Kopyalandı";
    toast("SQL kopyalandı. Şimdi SQL Editor'ı açıp yapıştırın.");
  } catch (e) {
    box.querySelector("textarea")?.remove();
    const ta = Object.assign(document.createElement("textarea"), {value: sql, rows: 8, readOnly: true});
    ta.style.marginTop = "10px";
    box.append(ta); ta.focus(); ta.select();
    toast("Metin seçildi; uzun basıp Kopyala deyin.");
  }
});

function pref(key, fallback, allowed) {
  try { const v = localStorage.getItem("tasmaqr-admin-" + key); if (v !== null && (!allowed || allowed.includes(v))) return v; } catch (e) {}
  return fallback;
}
function savePref(key, value) { try { localStorage.setItem("tasmaqr-admin-" + key, value); } catch (e) {} }

let printMode = pref("mode", "", ["", "only-sticker", "only-pin"]);
let defaultDesign = pref("design", "klasik");

// Seçili ölçüyü ve kağıt tipini künyelere ve yazdırma sayfasına uygular.
function applySize() {
  const grid = document.querySelector(".admingrid"), {w, h} = singlePage(stickerSize);
  if (grid) {
    grid.style.cssText = sizeVars(stickerSize);
    grid.className = ["admingrid", printMode, paper === "tek" ? "tek" : ""].join(" ").trim();
    grid.querySelectorAll(".sticker").forEach(el => {
      const round = dims(stickerSize).round;
      if (el.classList.contains("round") !== round) el.outerHTML = tagHtml(el.closest(".tag").dataset.code, designOf[el.closest(".tag").dataset.code], {round});
    });
  }
  let st = document.getElementById("pagestyle");
  if (!st) { st = Object.assign(document.createElement("style"), {id: "pagestyle"}); document.head.append(st); }
  st.textContent = paper === "tek" ? `@page{size:${w}mm ${h}mm;margin:0}` : `@page{size:A4;margin:${A4.M}mm}`;
}

function adminError(text) {
  document.getElementById("msg").innerHTML = `<div class="msg err noprint">${esc(text)}</div>`;
}

const setGiven = (codes, given) => rpc("tasma_admin_set_given", {p_key: adminKey, p_codes: codes, p_given: given});

// A4: künyeleri gerçek boyutlarıyla sayfaya dizer. Tek: her künye / PIN kartı kendi sayfasında (matbaa, etiket yazıcısı).
async function savePdf(codes) {
  await loadPdfLibs();
  const {jsPDF} = window.jspdf;
  const tags = codes.map(c => document.querySelector(`.tag[data-code="${CSS.escape(c)}"]`)).filter(Boolean);
  let pdf;
  if (paper === "tek") {
    const {w, h} = singlePage(stickerSize), fmt = [w, h];
    for (const tag of tags) {
      for (const el of tag.querySelectorAll(".sticker, .pin")) {
        if (!el.offsetParent) continue; // seçili modda gizli
        const s = await snap(el);
        if (pdf) pdf.addPage(fmt, "portrait"); else pdf = new jsPDF({unit: "mm", format: fmt, orientation: "portrait"});
        pdf.addImage(s.img, "PNG", (w - s.w) / 2, (h - s.h) / 2, s.w, s.h, undefined, "FAST");
      }
    }
  } else {
    pdf = new jsPDF({unit: "mm", format: "a4"});
    const shots = [];
    for (const tag of tags) shots.push(await snap(tag.querySelector(".block")));
    if (!layoutA4(pdf, shots)) pdf = null;
  }
  if (!pdf) throw new Error("Kaydedilecek künye yok");
  const name = codes.length === 1 ? `kunye-${codes[0]}` : `kunyeler-${codes.length}`;
  pdf.save(`${name}-${stickerSize}.pdf`);
}

// Yazdırır ya da PDF kaydeder; ardından verilmemiş olanları verildi olarak işaretlemeyi önerir.
async function deliver(codes, how) {
  if (!codes.length) return;
  if (how === "pdf") {
    toast("PDF hazırlanıyor…", 60000);
    try { await savePdf(codes); toast("PDF kaydedildi."); }
    catch (e) { document.querySelector(".toast")?.remove(); return adminError("PDF oluşturulamadı: " + e.message); }
  } else {
    document.querySelectorAll(".tag").forEach(t => t.classList.toggle("skip", !codes.includes(t.dataset.code)));
    await new Promise(done => { addEventListener("afterprint", done, {once: true}); print(); });
    document.querySelectorAll(".tag.skip").forEach(t => t.classList.remove("skip"));
  }
  const fresh = codes.filter(c => document.querySelector(`.tag[data-code="${CSS.escape(c)}"]`)?.dataset.state === "ready");
  if (!fresh.length) return;
  if (!confirm(`${fresh.length} künye verildi olarak işaretlensin mi? Verilen künyeler bu listede bir daha görünmez.`)) return;
  try {
    await setGiven(fresh, true);
    await showAdmin();
    confetti();
    toast(fresh.length === 1 ? `${fresh[0]} yeni dostuna kavuştu!` : `${fresh.length} künye yeni dostlarına yolculuğa çıktı!`);
  } catch (e) { adminError("İşaretlenemedi: " + e.message); }
}

  show(`

        <option value="all">Tümü (${requests?.length || 0})</option>
      </select>
      <button class="btn" id="csv">Excel için indir (CSV)</button>
    </div>
    <div id="msg"></div>
    <datalist id="ready-codes">${ready.map(c => `<option value="${esc(c)}">`).join("")}</datalist>
    ${requests && !list.length ? "<p>Bu listede talep yok.</p>" : ""}
    <div class="reqs">
      ${list.map(r => `
        <div class="req st-${esc(r.status)}" data-id="${esc(r.id)}">
          <div>
            <h3>${esc(r.first_name)} ${esc(r.last_name)}${r.pet_name ? ` · 🐾 ${esc(r.pet_name)}` : ""}</h3>
            <div class="meta">
              ${esc(dateTR(r.created_at))}<br>
              <a href="mailto:${esc(r.email)}">${esc(r.email)}</a>
              ${r.phone ? ` · <a href="tel:${esc(r.phone)}">${esc(prettyPhone(r.phone))}</a> ·
              <a href="${esc(waHref(r.phone, `Merhaba ${r.first_name}, Tasma QR künyeniz hazır!`))}" target="_blank" rel="noopener"><b>WhatsApp'tan istiyor</b></a>` : " · <span>E-postayla</span>"}
            </div>
            ${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}
          </div>
          <div class="act">
            <select data-f="status" aria-label="Durum">
              ${[["yeni", "Yeni"], ["verildi", "Künyesi verildi"], ["iptal", "İptal"]].map(([k, n]) =>
                `<option value="${k}"${k === r.status ? " selected" : ""}>${n}</option>`).join("")}
            </select>
            <input data-f="code" list="ready-codes" placeholder="Verilen künye kodu" value="${esc(r.tag_code || "")}" aria-label="Verilen künye kodu">
            <button data-act="save">Kaydet</button>
          </div>
        </div>`).join("")}
    </div>`, true);
  bindTabs();
  const filter = document.getElementById("rfilter");
  filter.value = reqFilter;
  filter.onchange = () => { reqFilter = filter.value; showRequests(rows, requests, newCount); };
  document.getElementById("csv").onclick = () => {
    const cols = ["created_at", "first_name", "last_name", "email", "phone", "pet_name", "note", "status", "tag_code"];
    // Formdan gelen metin Excel'de formül olarak çalışmasın (=, +, -, @ ile başlayanlar). Telefon sunucuda zaten yalnızca rakam ve +.
    const cell = (v, c) => { let t = String(v ?? ""); if (c !== "phone" && /^[=+\-@\t\r]/.test(t)) t = "'" + t; return `"${t.replace(/"/g, '""')}"`; };
    const csv = "﻿" + [cols.join(";"), ...list.map(r => cols.map(c => cell(r[c], c)).join(";"))].join("\r\n");
    downloadBlob(new Blob([csv], {type: "text/csv"}), "kunye-talepleri.csv");
  };
  document.querySelector(".reqs").onclick = async ev => {
    const btn = ev.target.closest('button[data-act="save"]');
    if (!btn) return;
    const box = btn.closest(".req"), id = Number(box.dataset.id);
    const status = box.querySelector('[data-f="status"]').value;
    const code = box.querySelector('[data-f="code"]').value.trim().toUpperCase();
    const msg = document.getElementById("msg");
    if (code && !rows.some(r => String(r.code).toUpperCase() === code)) {
      msg.innerHTML = `<div class="msg err">${esc(code)} kodunda bir künye yok.</div>`; return;
    }
    btn.disabled = true;
    try {
      await rpc("tasma_admin_request_update", {p_key: adminKey, p_id: id, p_status: status, p_tag_code: code || null});
      if (status === "verildi" && code && ready.includes(code)) await setGiven([code], true);
      await showAdmin();
      if (status === "verildi") { confetti(); toast("Talep tamamlandı, künye yolda!"); } else toast("Kaydedildi.");
    } catch (e) {
      btn.disabled = false;
      msg.innerHTML = `<div class="msg err">Kaydedilemedi: ${esc(e.message)}</div>`;
    }
  };
}

    ${orders && shop && !(shop.active && shop.iban && shop.account_name) ? `<div class="msg err">Satış kapalı: sitede sipariş alınmıyor. <b>Ayarlar</b> sekmesinden IBAN ve alıcı adını girip satışı açın.</div>` : ""}
    <div class="bar">
      <select id="ofilter" aria-label="Sipariş durumu">
        ${[...Object.entries(ORDER_STATUS).map(([k, n]) => [k, `${n} (${count(k)})`]), ["all", `Tümü (${orders?.length || 0})`]]
          .map(([k, n]) => `<option value="${k}"${k === orderFilter ? " selected" : ""}>${esc(n)}</option>`).join("")}
      </select>
    </div>
    <div id="msg"></div>
    ${orders && !list.length ? "<p>Bu listede sipariş yok.</p>" : ""}
    <div class="reqs">
      ${list.map(o => `
        <div class="req order st-${esc(o.status)}" data-id="${esc(o.id)}">
          <div>
            <h3>${esc(o.code)} · ${esc(o.amount)} TL${o.pet_name ? ` · 🐾 ${esc(o.pet_name)}` : ""}</h3>
            <div class="meta">
              <b>${esc(ORDER_STATUS[o.status] || o.status)}</b> · ${esc(dateTR(o.created_at))}${o.paid_at ? ` · ödeme bildirimi: ${esc(dateTR(o.paid_at))}` : ""}<br>
              <b>${esc(o.full_name)}</b> · <a href="tel:${esc(o.phone)}">${esc(prettyPhone(o.phone))}</a>
              · <a href="${esc(waHref(o.phone, customerMessage(o)))}" target="_blank" rel="noopener">WhatsApp</a>
              ${o.email ? ` · <a href="mailto:${esc(o.email)}">${esc(o.email)}</a>` : ""}<br>
              ${esc(o.address)}, ${esc(o.district)} / ${esc(o.city)}<br>
              Tasarım: ${esc(DESIGNS[o.design]?.name || o.design)} · QR: <a href="${esc(tagLink(o.tag_code))}" target="_blank" rel="noopener">${esc(o.tag_code)}</a>
              ${o.tracking ? ` · Takip no: <b>${esc(o.tracking)}</b>` : ""}
            </div>
            ${o.note ? `<div class="note">Müşteri notu: ${esc(o.note)}</div>` : ""}
            ${o.admin_note ? `<div class="note">Notunuz: ${esc(o.admin_note)}</div>` : ""}
          </div>
          <div class="act">
            ${["odeme_bekleniyor", "odeme_bildirildi"].includes(o.status) ? `<button data-act="approve" style="background:var(--ok)">✓ Ödeme geldi, onayla</button>` : ""}
            <button data-act="pdf">Baskı PDF'i indir</button>
            ${["onaylandi", "baskida"].includes(o.status) ? `<button data-act="mail">Baskıcıya e-posta</button>
              ${canShareFiles ? `<button data-act="share">PDF'i paylaş (e-posta ekli)</button>` : ""}` : ""}
            <input data-f="tracking" placeholder="Kargo takip no" value="${esc(o.tracking || "")}" aria-label="Kargo takip no">
            ${["onaylandi", "baskida"].includes(o.status) ? `<button data-act="shipped">Kargolandı</button>` : ""}
            <select data-f="status" aria-label="Durum">${Object.entries(ORDER_STATUS).map(([k, n]) =>
              `<option value="${k}"${k === o.status ? " selected" : ""}>${esc(n)}</option>`).join("")}</select>
            <input data-f="note" placeholder="Kendi notunuz" value="${esc(o.admin_note || "")}" aria-label="Not">
            <button data-act="save" style="background:#2b3240">Kaydet</button>
          </div>
        </div>`).join("")}
    </div>`, true);
  bindTabs();
  const filter = document.getElementById("ofilter");
  filter.onchange = () => { orderFilter = filter.value; showOrders(orders, newCount); };
  document.querySelector(".reqs").onclick = async ev => {
    const btn = ev.target.closest("button[data-act]");
    if (!btn) return;
    const box = btn.closest(".req"), o = orders.find(x => String(x.id) === box.dataset.id), act = btn.dataset.act;
    const f = name => box.querySelector(`[data-f="${name}"]`).value.trim();
    const msg = document.getElementById("msg");
    const update = async (status, done) => {
      await rpc("tasma_admin_order_update", {p_key: adminKey, p_id: o.id, p_status: status, p_tracking: f("tracking") || null, p_admin_note: f("note") || null});
      await showAdmin();
      if (done) done();
    };
    const fileName = `baski-${o.code}.pdf`;
    btn.disabled = true;
    try {
      if (act === "approve") {
        if (!confirm(`${o.code}: ${o.amount} TL hesabınıza geldi mi? Onaylanınca sipariş baskıya gönderilecekler listesine geçer.`)) return;
        await update("onaylandi", () => { confetti(); toast("Ödeme onaylandı. Müşteriye WhatsApp'tan haber verebilirsiniz."); });
      } else if (act === "pdf") {
        toast("Baskı PDF'i hazırlanıyor…", 30000);
        downloadBlob(await orderPdf(o), fileName);
        toast("PDF indirildi.");
      } else if (act === "mail") {
        toast("Baskı PDF'i hazırlanıyor…", 30000);
        downloadBlob(await orderPdf(o), fileName);
        const m = printerMail(o);
        location.href = `mailto:${encodeURIComponent(shop?.printer_email || "")}?subject=${encodeURIComponent(m.subject)}&body=${encodeURIComponent(m.body)}`;
        toast(`PDF indirildi: ${fileName}. Açılan e-postaya ekleyip gönderin.`, 6000);
        if (o.status === "onaylandi" && confirm("E-postayı gönderdiyseniz sipariş “Baskıda” olarak işaretlensin mi?")) await update("baskida");
      } else if (act === "share") {
        toast("Baskı PDF'i hazırlanıyor…", 30000);
        const m = printerMail(o);
        await navigator.share({files: [new File([await orderPdf(o)], fileName, {type: "application/pdf"})], title: m.subject,
          text: `${shop?.printer_email ? `Alıcı: ${shop.printer_email}\n\n` : ""}${m.body}`});
        document.querySelector(".toast")?.remove();
        if (o.status === "onaylandi" && confirm("Gönderdiyseniz sipariş “Baskıda” olarak işaretlensin mi?")) await update("baskida");
      } else if (act === "shipped") {
        if (!f("tracking") && !confirm("Takip numarası girmeden kargolandı olarak işaretlensin mi?")) return;
        await update("kargolandi", () => toast("Kargolandı. Müşteriye WhatsApp'tan takip numarasını iletebilirsiniz."));
      } else if (act === "save") {
        if (f("status") === "iptal" && o.status !== "iptal" && !confirm(`${o.code} iptal edilsin mi?`)) return;
        await update(f("status"), () => toast("Kaydedildi."));
      }
    } catch (e) {
      if (e.name !== "AbortError") msg.innerHTML = `<div class="msg err">İşlem yapılamadı: ${esc(e.message)}</div>`;
    } finally { btn.disabled = false; }
  };
}

// TR IBAN: TR + 24 rakam, mod 97 kontrolü
function validIban(iban) {
  const s = iban.replace(/\s/g, "").toUpperCase();
  if (!/^TR\d{24}$/.test(s)) return false;
  const num = (s.slice(4) + s.slice(0, 4)).replace(/[A-Z]/g, c => c.charCodeAt(0) - 55);
  let r = 0;
  for (const ch of num) r = (r * 10 + Number(ch)) % 97;
  return r === 1;
}

async function showSettings(newCount, error = "") {

      <label class="check"><input type="checkbox" id="s-active"${shop.active ? " checked" : ""}> Satış açık (sitede sipariş alınsın)</label>
      <label for="s-price">Fiyat (TL)</label><input id="s-price" type="number" inputmode="numeric" min="0" value="${esc(shop.price)}">
      <label for="s-product">Ürün açıklaması (sitede görünür)</label><textarea id="s-product" rows="3">${esc(shop.product_text || "")}</textarea>
      <label for="s-iban">IBAN</label><input id="s-iban" autocomplete="off" placeholder="TR00 0000 0000 0000 0000 0000 00" value="${esc((shop.iban || "").replace(/(.{4})/g, "$1 ").trim())}">

      <label for="s-bank">Banka adı <span class="opt">(isteğe bağlı)</span></label><input id="s-bank" value="${esc(shop.bank_name || "")}">
      <label for="s-ship">Kargo bilgisi (sitede görünür)</label><input id="s-ship" value="${esc(shop.shipping_text || "")}">

      <input id="s-printer" type="email" value="${esc(shop.printer_email || "")}">

      <h2>Ödeme bildirimi</h2>
      <p class="hint">Müşteri “Ödemeyi yaptım” deyince size anında haber gelir. Telegram, e-posta ya da ikisi birden.</p>

          <li>Telegram'da <b>@BotFather</b>'ı açın, <b>/newbot</b> yazın, bota bir ad verin.</li>
          <li>BotFather'ın verdiği <b>token</b>'ı aşağıya yapıştırın.</li>

      </details>

      <label for="s-tg-chat">Telegram chat ID</label>
      <div class="row2" style="align-items:end"><input id="s-tg-chat" inputmode="numeric" value="${esc(shop.telegram_chat_id || "")}">

        <ol>
          <li><b>resend.com</b>'da ücretsiz hesap açın (bildirim e-postası bu hesabın e-postası olmalı).</li>

    </form>` : ""}`, true);
  bindTabs();
  const form = document.getElementById("sf");
  if (!form) return;
  // Bota yazılan son mesajdan chat ID'yi bulur (Telegram API tarayıcıdan çağrılabilir)

    const token = document.getElementById("s-tg-token").value.trim();
    if (!/^\d+:[\w-]+$/.test(token)) return toast("Önce BotFather'ın verdiği token'ı yapıştırın.");
    try {
      const r = await (await fetch(`https://api.telegram.org/bot${token}/getUpdates`)).json();
      if (!r.ok) return toast("Token hatalı görünüyor.");
      const chat = [...(r.result || [])].reverse().map(u => (u.message || u.channel_post)?.chat).find(Boolean);
      if (!chat) return toast("Mesaj bulunamadı: botunuzu Telegram'da açıp Başlat'a basın, bir mesaj yazıp tekrar deneyin.", 6000);
      document.getElementById("s-tg-chat").value = chat.id;
      toast(`Bulundu: ${chat.first_name || chat.title || chat.id}. Şimdi Kaydet'e basın.`);
    } catch (e) { toast("Telegram'a ulaşılamadı."); }
  };
  const test = document.getElementById("notify-test");
  test.onclick = async () => {
    test.disabled = true;

      const r = await rpc("tasma_admin_notify_test", {p_key: adminKey});

    const price = parseInt(g("s-price"), 10);
    if (!(price >= 0)) return showSettings(newCount, "Fiyat geçersiz.");
    if (g("s-notify") && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(g("s-notify"))) return showSettings(newCount, "Bildirim e-postası geçersiz.");
    try {
      await rpc("tasma_admin_shop_set", {p_key: adminKey, p_active: active, p_price: price, p_iban: iban, p_account_name: g("s-name"),
        p_bank_name: g("s-bank"), p_printer_email: g("s-printer"), p_shipping_text: g("s-ship"), p_product_text: g("s-product"),
        p_telegram_bot_token: g("s-tg-token"), p_telegram_chat_id: g("s-tg-chat"), p_resend_api_key: g("s-resend"), p_notify_email: g("s-notify")});
      await showSettings(newCount);
      toast(active ? "Kaydedildi. Satış açık." : "Kaydedildi. Satış kapalı.");
    } catch (e) { showSettings(newCount, "Kaydedilemedi: " + e.message); }
  });
}

// ---------------------------------------------------------------- yönlendirme
async function route() {
  if (SUPABASE_URL.includes("BURAYA") || SUPABASE_KEY.includes("BURAYA")) {
    return showMessage("Kurulum eksik", "index.html dosyasının başındaki SUPABASE_URL ve SUPABASE_KEY değerlerini doldurun.");
  }
  if (params.has("admin")) return showAdminLogin();

  const code = (params.get("k") || "").trim().toUpperCase();
  if (code) {
    let tag;
    try { tag = await rpc("tasma_tag_lookup", {p_code: code}); }
    catch (e) { return showMessage("Bağlantı hatası", "Sayfayı yenileyip tekrar deneyin."); }
    if (!tag?.exists) return showMessage("Künye bulunamadı", "Bu QR kod geçerli bir künyeye ait değil.");
    if (params.has("duzenle") || !tag.phone) return showEdit(code, tag);
    return showFound(code, tag);
  }

  const [page, arg, extra] = location.hash.slice(1).split("/").map(decodeURIComponent);
  if (page === "olustur") return showCreate();
  if (page === "kunyelerim") return showMine();
  if (page === "kunye" && arg) return showTagPage(arg, extra === "yeni");
  if (page === "siparis" && arg) return showOrderForm(arg);
  if (page === "odeme" && arg) return showPay(arg);
  showHome();
}

addEventListener("hashchange", () => { if (!params.has("k") && !params.has("admin")) route(); });
route();
